name: gate

# Somebody who is not the author runs the gate, on a machine the author does not own, from a fresh
# clone. A green here is the only evidence in the whole ladder that does not rest on trusting the
# person making the claim — which is exactly what tier.mjs reads to decide PROVEN.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ⚑ PINNED. An unpinned gate is one whose rules can change under you between the run that passed
      # and the run you are citing, and "it passed on some version of the checker" is not a claim
      # anybody can verify.
      # v0.6 or newer. Before it, a quoted --test command line was spawned as an executable NAME
      # on POSIX, so a gate written that way never ran at all and reported a red baseline instead.
      - name: Fetch witness @v0.6
        run: git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git .witness

      # Catches the mistake that reports itself as nothing: a line pasted into a run: | block at the
      # wrong indent ends the block, and GitHub says only "a workflow file issue".
      - name: the workflows still parse as workflows
        run: node check-workflows.mjs

      # ⚑ fallworld does not own an engine. If fall-os has moved and this repo has not, the game is
      # quietly running last month's OS — so the copies are checked, not trusted.
      - name: still in step with fall-os
        run: node sync-fallos.mjs --check

      - name: Tests must pass before anything is mutated
        run: |
          node --test tier.test.mjs pass.test.mjs client.test.mjs ladder.test.mjs

      # The mutation gate attacks the TESTS. A green suite sitting over a broken line is test-theatre,
      # and this is the step that catches it.
      - name: Mutation gate
        run: |
          node .witness/witness.mjs mutate tier.mjs \
            --cap 400 \
            --baseline witness.tier.baseline.json \
            --test node tier.test.mjs | tee gate.out
          node .witness/witness.mjs mutate pass.mjs --cap 400 --test node --test pass.test.mjs | tee -a gate.out
          node .witness/witness.mjs mutate client.mjs --test node --test client.test.mjs | tee -a gate.out
          node .witness/witness.mjs mutate ladder.mjs --test node --test ladder.test.mjs | tee -a gate.out

      # ⚑ The page a visitor gets must be the page this build makes. Regenerate and diff: a stale
      # index.html means the shop on screen and the shop that was gated are two different shops.
      - name: the client is the kernel
        run: |
          node build-client.mjs
          git diff --exit-code -- index.html manifest.webmanifest sw.js || {
            echo 'index.html is stale — run: node build-client.mjs && git add index.html'; exit 1; }

      # A gate that reports "not clean" and exits zero is decorative. This line is what makes the
      # workflow's own conclusion mean something.
      - name: Refuse anything short of clean
        run: |
          node -e "
            const out = require('fs').readFileSync('gate.out','utf8');
            // EVERY verdict in the file, not the first. Two kernels are gated into this one output,
            // and .exec() stops at the first match — so a clean tier.mjs would have covered a dirty
            // pass.mjs completely silently.
            const all = [...out.matchAll(/\"clean\":\s*(true|false)/g)].map(m => m[1]);
            if (all.length === 0) { console.error('the gate produced no verdict at all'); process.exit(1); }
            // Counted from the kernels this job actually gates, never typed. A hard-coded 2 went
            // stale the moment a third kernel arrived, and a count nobody updates fails a build
            // that was perfectly clean — which is how a real check gets deleted.
            const KERNELS = ['tier.mjs', 'pass.mjs', 'client.mjs', 'ladder.mjs'];
            if (all.length !== KERNELS.length) { console.error('expected ' + KERNELS.length + ' gate verdicts (' + KERNELS.join(', ') + '), saw ' + all.length + ' — a kernel was not gated'); process.exit(1); }
            if (all.some(v => v !== 'true')) { console.error('mutants survived — those lines are test-theatre'); process.exit(1); }
            console.log(all.length + ' gates clean');
          "
