name: refresh
# ⚑ WHY THIS EXISTS. The gate runs on a push, so it only notices that fall-os or fall-kit has moved
# when somebody happens to push here. fall-kit went from v2.0.0 to 3.2.0 on 23-26 Oct and this repo
# did not find out until a push on 31 Oct turned the gate red. A daily look at the engine it vendors
# turns that week of quiet drift into a red the next morning.
#
# ⚑ WHAT IT DOES NOT DO, SAID PLAINLY. It used to start by running scan-ci.mjs and scan-tiers.mjs,
# which live in scripts/, not at the root, and which read estate-index.json out of the private memory
# on one machine. On a runner both died with "Cannot find module" every single morning, the step
# printed "keeping the previous evidence", and the job still went green: a re-scan that had never once
# run, sitting here looking like one. The evidence and world.json are re-scanned and regenerated
# locally (scripts/scan-ci.mjs, scripts/scan-tiers.mjs, scripts/build-world.mjs) and committed; a
# runner cannot see the private index, and must not.
on:
  schedule:
    - cron: '17 6 * * *'      # daily, early
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  rescan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # Red, not auto-synced. Pulling a moved engine in unreviewed would ship it without the gate:
      # a push made with this job's token does not start the gate workflow.
      - name: the engine is still the one fall-os and fall-kit publish
        run: node scripts/sync-fallos.mjs --check

      - name: what the world shows is what its pinned repos give
        run: node scripts/sync-sources.mjs --check

      # ⚑ Generated, never typed. Both builders read only files in this repo, so a runner can run them.
      - name: rebuild every generated surface a runner can build
        run: |
          node scripts/build-client.mjs
          node scripts/build-ecosystem.mjs

      - name: the kernels still hold
        run: node --test *.test.mjs

      # Only commit a real change. A no-op commit every morning teaches everyone to ignore the log.
      - name: publish only if something actually moved
        run: |
          git config user.name  "fallworld-refresh"
          git config user.email "noreply@github.com"
          if git diff --quiet; then
            echo "nothing moved — the hub is already current"
          else
            git add -A
            git commit -m "refresh: a generated page was stale, so it was rebuilt" -m "Rebuilt from the committed world by the scheduled refresh, not by hand."
            git push
            echo "hub updated"
          fi
