<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FALL WORLD</title>
<meta name="description" content="Install it like a game. Learn to use AI by using it — start on a key you already have, end up running on your own machine.">
<meta name="theme-color" content="#0a0c10">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --void:#0a0c10; --deck:#12161d; --sunk:#0d1016; --edge:#232a35; --soft:#181d26;
  --ink:#e2e8f0; --mid:#8d99a8; --faint:#5b6675;
  --gold:#dcb264; --gold-deep:#7d6224;
  --mine:#54d199; --rent:#e08a45; --stop:#dd6055; --cool:#5fa8e8;
  /* the estate's own grades, coloured the way a loot game colours them */
  --r-normal:#c8cdd6; --r-magic:#6f9df0; --r-rare:#e2cf62; --r-set:#4fd18f; --r-unique:#d0a05f;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Cascadia Mono',monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--sans);font-size:14.5px;
  line-height:1.55;display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h2{margin:0 0 4px;font-size:20px;font-weight:650;letter-spacing:-.01em}
h3{margin:16px 0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}
p.lead{margin:0 0 16px;color:var(--mid);max-width:70ch}
a{color:var(--cool)}

#top{display:grid;grid-template-columns:auto minmax(120px,1fr) auto;gap:8px 16px;align-items:center;
  padding:8px 14px;background:var(--deck);border-bottom:1px solid var(--edge);flex:0 0 auto;
  padding-top:max(8px,env(safe-area-inset-top))}
.crest{display:flex;align-items:baseline;gap:9px;min-width:0}
.crest .t{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.2em}
.crest .t b{color:var(--gold)}
.rank{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--gold-deep);color:var(--gold);border-radius:2px;padding:2px 7px;white-space:nowrap}
.xp .lab{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.xp .lab b{color:var(--mine);font-variant-numeric:tabular-nums}
.xp .lab b.r{color:var(--rent)}
.track{height:10px;background:var(--sunk);border:1px solid var(--edge);border-radius:2px;display:flex;overflow:hidden}
.track i{background:var(--mine);transition:width .35s}
.track u{background:repeating-linear-gradient(45deg,var(--rent),var(--rent) 4px,transparent 4px,transparent 8px);transition:width .35s}
#topRight{display:flex;gap:8px;align-items:center}
#topRight button{background:none;border:1px solid var(--edge);color:var(--mid);border-radius:3px;padding:3px 9px;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
#topRight button:hover{border-color:var(--gold);color:var(--gold)}
@media (max-width:720px){ #top{grid-template-columns:1fr auto} .xp{grid-column:1/-1} }

/* the guide: one voice, one line, always skippable */
#npc{background:linear-gradient(180deg,var(--deck),var(--sunk));border-bottom:1px solid var(--edge);
  padding:12px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;flex:0 0 auto}
#npc.gone{display:none}
#npc .face{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold-deep);display:grid;place-items:center;
  font-size:15px;background:var(--void);flex:0 0 auto}
#npc .said{min-width:0}
#npc .said .l{font-size:15px;line-height:1.5}
#npc .said .a{font-size:12.5px;color:var(--faint);margin-top:4px}
#npc .said .n{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-top:6px}
#npc .x{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
#npc .x button{background:none;border:1px solid var(--edge);color:var(--faint);border-radius:3px;padding:2px 8px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
#npc .x button:hover{border-color:var(--gold);color:var(--gold)}
#npc .x .step{font-family:var(--mono);font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.unlocked{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);z-index:20;
  background:var(--deck);border:1px solid var(--gold);border-radius:5px;padding:9px 16px;
  display:flex;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.5);
  animation:rise .35s ease}
.unlocked .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.lockedNote{border:1px dashed var(--edge);border-radius:5px;padding:14px 16px;color:var(--faint);font-size:13.5px}

#body{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr)}
nav{background:var(--deck);border-right:1px solid var(--edge);display:flex;flex-direction:column;padding:8px 6px;gap:3px;overflow-y:auto}
nav button{display:flex;align-items:center;gap:9px;background:none;border:1px solid transparent;border-radius:4px;
  padding:7px 10px;cursor:pointer;color:var(--mid);white-space:nowrap;text-align:left}
nav button:hover{background:var(--sunk);color:var(--ink)}
nav button.on{background:var(--sunk);border-color:var(--gold-deep);color:var(--gold)}
nav .ic{font-size:15px;width:18px;text-align:center;flex:0 0 auto}
nav .k{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--faint);border:1px solid var(--edge);border-radius:2px;padding:0 4px}
@media (max-width:760px){
  #body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  nav{flex-direction:row;border-right:none;border-bottom:1px solid var(--edge);overflow-x:auto;padding:6px}
  nav .lb,nav .k{display:none} nav button{padding:8px 12px} nav .ic{font-size:17px}
}
main{overflow-y:auto;padding:18px 20px 44px;min-width:0}
.panel{max-width:1000px}

.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.card{border:1px solid var(--edge);border-left-width:3px;border-radius:5px;background:var(--deck);padding:11px 13px;display:grid;gap:5px}
.card.proven{border-left-color:var(--mine)} .card.works{border-left-color:var(--cool)} .card.prototype{border-left-color:var(--faint)}
.card .r1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .nm{font-weight:650}
.card.n-normal .nm{color:var(--r-normal)} .card.n-magic .nm{color:var(--r-magic)}
.card.n-rare .nm{color:var(--r-rare)} .card.n-set .nm{color:var(--r-set)} .card.n-unique .nm{color:var(--r-unique)}
.card.n-magic{border-left-color:var(--r-magic)} .card.n-rare{border-left-color:var(--r-rare)}
.card.n-set{border-left-color:var(--r-set)} .card.n-unique{border-left-color:var(--r-unique)}
.rar{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.rar.n-normal{color:var(--r-normal)} .rar.n-magic{color:var(--r-magic)} .rar.n-rare{color:var(--r-rare)}
.rar.n-set{color:var(--r-set)} .rar.n-unique{color:var(--r-unique)}
.tool.n-magic{border-left-color:var(--r-magic)} .tool.n-rare{border-left-color:var(--r-rare)}
.tool.n-set{border-left-color:var(--r-set)} .tool.n-unique{border-left-color:var(--r-unique)}
.slot .fn{color:var(--ink)}
.card .d{font-size:12.5px;color:var(--mid)}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--edge);
  border-radius:99px;padding:1px 7px;color:var(--faint);white-space:nowrap}
.tag.proven{border-color:var(--mine);color:var(--mine)}
.tag.works{border-color:var(--cool);color:var(--cool)}
.tag.price{border-color:var(--gold-deep);color:var(--gold)}
.tag.on{border-color:var(--mine);color:var(--mine)}
.ev{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.reach{display:flex;flex-wrap:wrap;gap:4px}
.rc{font-family:var(--mono);font-size:9.5px;border-radius:2px;padding:1px 6px;border:1px solid var(--edge);color:var(--mid)}
.rc.no{color:var(--faint);opacity:.5;text-decoration:line-through}
.act{background:none;border:1px solid var(--gold-deep);color:var(--gold);border-radius:4px;padding:5px 11px;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;justify-self:start}
.act:hover{background:var(--sunk)}

.warn{border:1px solid var(--stop);color:var(--stop);border-radius:5px;padding:11px 13px;margin-bottom:12px;font-size:13.5px}
.note{border:1px solid var(--edge);border-radius:5px;padding:11px 13px;margin-bottom:12px;font-size:13.5px;color:var(--mid)}
.note b,.warn b{color:var(--ink)} .warn b{color:var(--stop)}
.good{border-color:var(--mine);color:var(--mine)} .good b{color:var(--mine)}
.quiet{color:var(--faint);font-style:italic;font-size:13px}


/* ── the opening: what this is, said once, to somebody who has never seen it ─────────── */
.opening{border:1px solid var(--edge);border-radius:8px;background:var(--deck);padding:18px 20px;margin-bottom:16px}
.opening h2{font-size:23px;margin:0 0 10px}
.opening p{margin:0 0 10px;color:var(--mid);max-width:66ch;font-size:15px}
.opening p b{color:var(--ink);font-weight:650}
.opening .three{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:14px}
.opening .one{border-left:2px solid var(--gold-deep);padding-left:11px}
.opening .one .t{font-weight:650;font-size:14px;margin-bottom:2px}
.opening .one .d{font-size:13px;color:var(--faint);line-height:1.45}
/* the didy */
#ask{width:100%;min-height:90px;background:var(--sunk);border:1px solid var(--edge);border-radius:5px;
  padding:11px 13px;font-size:15px;resize:vertical}
.row{display:flex;gap:9px;align-items:center;margin-top:10px;flex-wrap:wrap}
.go{background:var(--gold);color:var(--void);border:none;border-radius:5px;padding:9px 18px;font-weight:700;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.go:disabled{background:var(--sunk);color:var(--faint);border:1px solid var(--edge);cursor:default}
.where{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}
.where b{color:var(--mine)} .where b.r{color:var(--rent)}
.stance{border:1px solid var(--edge);border-left-width:3px;border-radius:5px;background:var(--deck);padding:11px 13px;margin-bottom:8px}
.stance.top{border-left-color:var(--gold)}
.stance.held{border-left-color:var(--mine)}
.stance.road{border-left-color:var(--faint);opacity:.72}
.stance .h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.stance .n{font-weight:650}
.stance .sc{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.stance .m{font-size:13px;color:var(--mid);margin-top:3px}
.stance .cue{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:4px}
.pick{background:none;border:1px solid var(--gold-deep);color:var(--gold);border-radius:4px;padding:4px 10px;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:7px}

/* keys */
.field{display:grid;gap:6px;margin-bottom:14px;max-width:620px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.field input{background:var(--sunk);border:1px solid var(--edge);border-radius:4px;padding:9px 11px;font-family:var(--mono);font-size:12.5px}
.field .h{font-size:12.5px;color:var(--faint)}
.rungs{display:grid;gap:8px;max-width:640px}
.rung{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;border:1px solid var(--soft);
  border-radius:5px;background:var(--sunk);padding:10px 12px}
.rung.have{border-color:var(--mine)}
.rung .p{width:9px;height:9px;transform:rotate(45deg);background:var(--edge)}
.rung.have .p{background:var(--mine)}
.rung .t{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase}
.rung.have .t{color:var(--mine)}
.rung .s{font-size:12.5px;color:var(--mid)}
.rung .st{font-family:var(--mono);font-size:10px;color:var(--faint);white-space:nowrap}

.zones{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(225px,1fr))}
.zone{display:block;text-decoration:none;color:inherit;border:1px solid var(--edge);border-radius:5px;background:var(--deck);padding:10px 12px}
.zone:hover{border-color:var(--gold)}
.zone .n{font-weight:650;display:block} .zone .s{font-size:12.5px;color:var(--mid);display:block;margin-top:2px}
.zone .first{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.wing{margin-bottom:22px} .wing .wh{display:flex;align-items:baseline;gap:9px;margin-bottom:6px}
.wing .ic{font-size:17px} .wing .wb{font-size:13px;color:var(--mid);margin:0 0 9px}


/* ── the cockpit: talk on the left, your didy and its kit on the right ───── */
.cockpit{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,330px);gap:14px;align-items:start}
@media (max-width:900px){ .cockpit{grid-template-columns:1fr} }
.rig{border:1px solid var(--edge);border-radius:8px;background:var(--deck);padding:14px;position:sticky;top:0}
.rig .who{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);text-align:center}
.rig .ring{width:74px;height:74px;margin:10px auto;border-radius:50%;border:2px solid var(--gold-deep);
  display:grid;place-items:center;font-size:28px;background:var(--void);transition:box-shadow .3s,border-color .3s}
.rig.powered .ring{border-color:var(--mine);box-shadow:0 0 20px color-mix(in srgb,var(--mine) 35%,transparent)}
.rig .can{font-size:12.5px;color:var(--mid);text-align:center;line-height:1.45}
.rig .can b{color:var(--mine)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}
.slot{border:1px dashed var(--edge);border-radius:6px;min-height:58px;display:grid;place-items:center;padding:7px;
  text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  transition:border-color .15s,background .15s}
.slot.over{border-color:var(--gold);border-style:solid;background:color-mix(in srgb,var(--gold) 12%,transparent)}
.slot.filled{border-style:solid;border-color:var(--mine);background:var(--sunk)}
.slot .fn{font-family:var(--sans);font-size:12.5px;font-weight:650;letter-spacing:0;text-transform:none;color:var(--mine)}
.slot .pull{background:none;border:none;color:var(--faint);cursor:pointer;font-size:9.5px;text-decoration:underline;margin-top:2px}
.stats{display:grid;gap:5px;border-top:1px solid var(--edge-soft);padding-top:10px;margin-top:4px}
.stat{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.stat b.m{color:var(--mine)} .stat b.r{color:var(--rent)}
.tools{display:grid;gap:6px;margin-top:10px;border-top:1px solid var(--edge-soft);padding-top:10px}
.tool{border:1px solid var(--edge);border-left-width:3px;border-radius:5px;background:var(--sunk);padding:7px 9px;cursor:grab;user-select:none}
.tool:active{cursor:grabbing}
.tool.dragging{opacity:.45}
.tool.proven{border-left-color:var(--mine)} .tool.works{border-left-color:var(--cool)} .tool.prototype{border-left-color:var(--faint)}
.tool .tn{font-weight:650;font-size:12.5px}
.tool .grab{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
#log{border-top:1px solid var(--edge);background:var(--deck);flex:0 0 auto;display:flex;gap:9px;align-items:center;
  padding:8px 14px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#log .by{font-family:var(--mono);font-size:10px;color:var(--faint);white-space:nowrap;letter-spacing:.06em}
#log .by b{color:var(--gold)}
#log .line{flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.cardgate { border: 1.5px dashed rgba(212,160,23,0.45); border-radius: 8px; padding: 12px 14px; margin: 10px 0 14px; cursor: pointer; transition: border-color .15s, background .15s; }
.cardgate:hover, .cardgate.over { border-color: var(--gold, #d4a017); background: rgba(212,160,23,0.07); }
.cardgate .t { font-size: .92em; opacity: .92; }
.mindbox { border: 1px solid rgba(127,156,201,0.3); border-radius: 8px; padding: 10px 14px; margin: 0 0 14px; background: rgba(127,156,201,0.05); }
.mindbox .ms { font-size: .92em; }
.mindbox button { margin-top: 6px; }
.remembers { border-left: 2px solid rgba(127,156,201,0.5); padding: 6px 10px; margin: 10px 0; }
.remembers .rh { font-size: .8em; letter-spacing: .1em; text-transform: uppercase; opacity: .65; margin-bottom: 4px; }
.remembers .rl { font-size: .92em; margin: 2px 0; }
.remembers .rv { opacity: .55; font-size: .88em; }
.remembers .rw { font-size: .88em; opacity: .7; font-style: italic; margin-top: 5px; }
.journey { border: 1px solid rgba(212,160,23,0.25); border-radius: 8px; padding: 10px 14px; margin: 0 0 14px; background: rgba(212,160,23,0.04); }
.journey .jhead { letter-spacing: .04em; }
.journey .jhead b { color: var(--gold, #d4a017); }
.journey .jdot { opacity: .25; margin-left: 4px; font-size: .8em; }
.journey .jdot.lit { opacity: 1; color: var(--gold, #d4a017); }
.journey .jnext { margin-top: 4px; font-size: .93em; }
.journey .jnote { margin-top: 3px; font-size: .78em; opacity: .55; }
</style>
</head>
<body>

<div id="top">
  <div class="crest"><span class="t">FALL<b>·</b>WORLD</span><span class="rank" id="rank">renting</span></div>
  <div class="xp">
    <div class="lab"><span>ran on your own machine</span><span id="split">nothing yet</span></div>
    <div class="track" id="track"><i style="width:0"></i><u style="width:0"></u></div>
  </div>
  <div id="topRight"><button type="button" id="install">install</button></div>
</div>

<div id="npc"></div>

<div id="body">
  <nav id="nav"></nav>
  <main><div class="panel" id="panel"></div></main>
</div>

<div id="log">
  <span class="line" id="logline">loading…</span>
  <span class="by">powered by <b>fall&middot;os</b> &middot; Konomi Architecture</span>
  <a class="by" id="who" href="https://www.ai-nativesolutions.com/" target="_blank" rel="noopener"></a>
</div>

<script type="module">
/*__KERNEL__*/

// ══════════════════════════════════════════════════════════════════════════════════════════════
// THE EASY FACE. Everything above is fall-os and the estate's own index; nothing below re-decides
// anything. This file's whole job is to say what that engine did in words a person can act on.
// ══════════════════════════════════════════════════════════════════════════════════════════════
const $ = (s) => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

// si-didy's studied MIND: distilled overnight on this machine (the deepening loop), LOADED here
// by the player — the file never rides in a repo or a page. It lives in this browser and nowhere
// else, like a key.
let MINDFILE = null;
try { MINDFILE = JSON.parse(localStorage.getItem('fallworld.mind.v1') || 'null'); } catch {}
function mindPanel() {
  const w = el('div', 'mindbox');
  const v = validMind(MINDFILE);
  const status = el('div', 'ms');
  if (v.ok) {
    status.innerHTML = '<b>mind loaded</b> \u00b7 ' + esc(v.why) + ' \u2014 your didy answers with what si-didy studied';
    const forget = el('button', 'pull', 'forget it'); forget.type = 'button';
    forget.addEventListener('click', () => {
      MINDFILE = null;
      try { localStorage.removeItem('fallworld.mind.v1'); } catch {}
      say('The mind is forgotten here. The file on your machine is untouched \u2014 load it again any time.');
      draw();
    });
    w.append(status, forget);
  } else {
    status.innerHTML = 'si-didy studies the estate nightly on your machine. <b>Load its mind</b> and your didy answers with what it learned \u2014 the file stays in this browser, nowhere else. It lives at <code>si-didy-loop/local-dna/mind.json</code>.';
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json,.json'; inp.hidden = true;
    inp.addEventListener('change', async () => {
      const f = inp.files[0]; if (!f) return;
      try {
        const parsed = JSON.parse(await f.text());
        const check = validMind(parsed);
        if (!check.ok) { say('Not loaded: ' + check.why); return; }
        MINDFILE = parsed;
        try { localStorage.setItem('fallworld.mind.v1', JSON.stringify(parsed)); }
        catch { say('The mind is live for this visit, but too large for this browser to keep \u2014 it will need loading again next time. Honest trade.'); }
        say('\u2713 The mind is in: ' + check.why + '. Ask your didy something \u2014 it remembers now.');
        draw();
      } catch { say('That file is not JSON \u2014 the mind lives at si-didy-loop/local-dna/mind.json.'); }
      inp.value = '';
    });
    const btn = el('button', 'act', 'load its mind'); btn.type = 'button';
    btn.addEventListener('click', () => inp.click());
    w.append(status, inp, btn);
  }
  return w;
}

// The levelling spine, drawn. The level is computed from what actually happened (journey.mjs,
// gated); this strip only SAYS it. Doors are never barred — the spine lights the next one.
// What the page can SEE beyond its own save: the Duel's victory ledger lives in this same
// origin's IndexedDB, so a win in the game is an observable fact here — read, never trusted.
let DUELS_WON = 0;
function observeOutside() {
  try {
    const req = indexedDB.open('fallkard', 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('decks')) db.createObjectStore('decks', { keyPath: 'name' });
      if (!db.objectStoreNames.contains('inventory')) db.createObjectStore('inventory', { keyPath: 'id' });
    };
    req.onsuccess = () => {
      try {
        const db = req.result;
        const tx = db.transaction('inventory', 'readonly');
        tx.objectStore('inventory').get('main').onsuccess = (e) => {
          const inv = e.target.result;
          const n = inv && Array.isArray(inv.defeated) ? inv.defeated.length : 0;
          if (n !== DUELS_WON) { DUELS_WON = n; draw(); }
          db.close();
        };
        tx.onerror = () => db.close();
      } catch { /* the ledger is simply not there yet */ }
    };
    req.onerror = () => {};
  } catch { /* no IndexedDB: private mode — the deep cores stay unlit */ }
}
observeOutside();

/* ── the card gate · inlined verbatim-adapted from fallkard-forge card.mjs @ d380947 ──
   Cards are how tools travel: a picture that openly carries a real build, sealed with a hash.
   Reading one back means: parse the declared PNG chunks, take the payload and manifest out,
   RECOMPUTE the seal, and refuse anything that does not match. No trust, just arithmetic. */
const CARDGATE = (() => {
  const PNG_SIG = new Uint8Array([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);
  const PAYLOAD_KEYWORD = 'konomi-payload', MANIFEST_KEYWORD = 'konomi-manifest', NUL = '\u0000';
  const latin1 = (u8) => { let out = ''; for (const b of u8) out += String.fromCharCode(b); return out; };
  function parseChunks(png) {
    const u8 = (png instanceof Uint8Array) ? png : new Uint8Array(png || []);
    if (u8.length < 8) throw new Error('not a PNG (too short)');
    for (let i = 0; i < 8; i++) if (u8[i] !== PNG_SIG[i]) throw new Error('not a PNG (bad signature)');
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const chunks = [];
    let off = 8, sawEnd = false;
    while (off + 8 <= u8.length) {
      const length = dv.getUint32(off);
      if (off + 12 + length > u8.length) throw new Error('PNG is truncated \u2014 a chunk runs past the end of the file');
      const type = latin1(u8.subarray(off + 4, off + 8));
      chunks.push({ type, data: u8.subarray(off + 8, off + 8 + length) });
      off += 12 + length;
      if (type === 'IEND') { sawEnd = true; break; }
    }
    if (!sawEnd) throw new Error('PNG is truncated \u2014 it has no IEND');
    return chunks;
  }
  function readText(chunks, keyword) {
    for (const c of (Array.isArray(chunks) ? chunks : [])) {
      if (!c || c.type !== 'tEXt') continue;
      const t = latin1(c.data);
      const nul = t.indexOf(NUL);
      if (nul < 0) continue;
      if (t.slice(0, nul) === String(keyword)) return t.slice(nul + 1);
    }
    return null;
  }
  async function readZText(chunks, keyword) {
    for (const c of (Array.isArray(chunks) ? chunks : [])) {
      if (!c || c.type !== 'zTXt') continue;
      const t = latin1(c.data);
      const nul = t.indexOf(NUL);
      if (nul < 0 || t.slice(0, nul) !== String(keyword)) continue;
      const deflated = c.data.subarray(nul + 2); // NUL + 1-byte compression method
      const ds = new DecompressionStream('deflate');
      const out = new Response(new Blob([deflated]).stream().pipeThrough(ds));
      return latin1(new Uint8Array(await out.arrayBuffer()));
    }
    return null;
  }
  const sha256hex = async (u8) => Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', u8)))
    .map(b => b.toString(16).padStart(2, '0')).join('');

  /* the artifact layer \u00b7 verbatim-adapted from fallkard-forge artifact.mjs @ 77e2594 (gated in
     its own repo). A sovereign artifact rides in a third declared chunk: a KCC-MINT-001 bundle
     whose claims are all checkable FROM THE FILE \u2014 contains, tier-earned, lineage, signature. */
  const ARTIFACT_KEYWORD = 'konomi-artifact';
  const canonicalJson = (v) => {
    if (v === null || typeof v !== 'object') return JSON.stringify(v);
    if (Array.isArray(v)) return '[' + v.map(canonicalJson).join(',') + ']';
    return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canonicalJson(v[k])).join(',') + '}';
  };
  const signable = (bundle) => {
    const b = (bundle && typeof bundle === 'object') ? bundle : {};
    const m = { ...((b.mint && typeof b.mint === 'object') ? b.mint : {}) };
    delete m.minter_sig_b64;
    return canonicalJson({ ...b, mint: m });
  };
  // the tier rule, verbatim from the forge's card kernel \u2014 the earned grade is recomputed HERE
  const rarityOf = (o) => {
    const assessorPass = !!o.assessorPass, depth = Number(o.depth) || 0, readingKeyHonest = !!o.readingKeyHonest;
    if (assessorPass && depth >= 3 && readingKeyHonest) return 'holo';
    if (assessorPass && depth >= 2) return 'rare';
    if (assessorPass) return 'uncommon';
    return 'common';
  };
  async function verifyArtifactHere(bundle, sealComputed, cardManifest) {
    const b = (bundle && typeof bundle === 'object') ? bundle : {};
    const mint = (b.mint && typeof b.mint === 'object') ? b.mint : {};
    const checks = [];
    const add = (name, ok, why) => checks.push({ name, ok: !!ok, why });
    add('contains the build', sealComputed !== '' && mint.fork_sha === sealComputed,
      mint.fork_sha === sealComputed ? 'the bundle seals exactly the build inside'
        : 'the bundle points at a different build than the one inside \u2014 a receipt, not a container');
    const m2 = (cardManifest && typeof cardManifest === 'object') ? cardManifest : {};
    const earned = rarityOf({ assessorPass: !!m2.assessor_pass, depth: 0, readingKeyHonest: true });
    add('tier is earned', b.tier === earned,
      b.tier === earned ? 'the tier "' + b.tier + '" matches what the evidence earns'
        : 'the bundle claims "' + b.tier + '" but the evidence earns "' + earned + '" \u2014 a claimed grade is refused');
    const kpidOk = typeof mint.kpid === 'string' && /^kcc:[a-z0-9-]+:(gen0|fork):[0-9a-f]{8}$/.test(mint.kpid)
      && mint.kpid.endsWith(String(mint.fork_sha || '').slice(0, 8));
    const parentOk = mint.parent_kpid === null || (typeof mint.parent_kpid === 'string' && /^kcc:/.test(mint.parent_kpid));
    add('lineage is well-formed', kpidOk && parentOk,
      kpidOk && parentOk ? 'kpid and parent both read as KCC lineage'
        : 'the identifiers do not read as KCC lineage');
    if (mint.minter_sig_b64 && mint.minter_pubkey_b64) {
      let good = false;
      try {
        const un = (x) => Uint8Array.from(atob(x), c => c.charCodeAt(0));
        const key = await crypto.subtle.importKey('raw', un(mint.minter_pubkey_b64), { name: 'Ed25519' }, false, ['verify']);
        good = await crypto.subtle.verify({ name: 'Ed25519' }, key, un(mint.minter_sig_b64), new TextEncoder().encode(signable(b)));
      } catch { good = false; }
      add('signature verifies', good, good ? 'the minter signed exactly these bytes'
        : 'the signature does not match the bundle \u2014 tampered, or signed by someone else');
    } else {
      add('signature verifies', false, 'the bundle is unsigned \u2014 lineage is asserted, not proven');
    }
    return { ok: checks.every(c => c.ok), checks };
  }
  async function readCard(u8) {
    const chunks = parseChunks(u8);
    let payloadB64 = readText(chunks, PAYLOAD_KEYWORD);
    if (payloadB64 == null) payloadB64 = await readZText(chunks, PAYLOAD_KEYWORD);
    const manifestRaw = readText(chunks, MANIFEST_KEYWORD);
    let manifest = null;
    if (manifestRaw != null) { try { manifest = JSON.parse(manifestRaw); } catch { /* said below */ } }
    if (manifest == null && payloadB64 == null) return { isCard: false, reason: 'a plain picture \u2014 there is no build inside it' };
    if (manifestRaw != null && manifest == null) return { isCard: false, reason: 'the manifest on this card is not readable' };
    if (payloadB64 == null) return { isCard: false, reason: 'it has a manifest but the build is missing' };
    if (manifest == null) return { isCard: false, reason: 'it has a build but nothing says what it is' };
    let bundle = null;
    const bRaw = readText(chunks, ARTIFACT_KEYWORD);
    if (bRaw != null) { try { bundle = JSON.parse(bRaw); } catch { bundle = null; } }
    return { isCard: true, manifest, payloadB64, bundle };
  }
  return { readCard, sha256hex, verifyArtifactHere };
})();

async function cardArrives(file) {
  try {
    const u8 = new Uint8Array(await file.arrayBuffer());
    let r;
    try { r = await CARDGATE.readCard(u8); } catch (e) { say('Not a card: ' + e.message); return; }
    if (!r.isCard) { say(r.reason + '. Nothing installed.'); return; }
    const gz = Uint8Array.from(atob(r.payloadB64), ch => ch.charCodeAt(0));
    const actual = await CARDGATE.sha256hex(gz);
    if (actual !== r.manifest.seal) {
      say('The seal does not match \u2014 this card was changed after it was forged. Refused: nothing installed.');
      return;
    }
    const id = 'card-' + actual.slice(0, 8);
    if (me.bags.includes(id)) { say('You already hold this card.'); return; }

    // the artifact layer, when one rides on the card: every claim re-checked HERE, never trusted
    let art = null;
    if (r.bundle) art = await CARDGATE.verifyArtifactHere(r.bundle, actual, r.manifest);

    const tag = String(r.manifest.tags || '').split(',')[0].split(':')[0].trim();
    const artName = (art && art.ok && r.bundle && typeof r.bundle.name === 'string' && r.bundle.name) ? r.bundle.name : null;
    const entry = {
      id,
      name: artName ? artName + ' (artifact)' : tag ? tag + ' (card)' : 'forged card ' + actual.slice(0, 8),
      kind: 'card',
      does: art && art.ok
        ? 'a SOVEREIGN ARTIFACT \u2014 the build is inside, the tier was earned, and the minter\u2019s Ed25519 signature verified here, from the file alone. Hatch it in the Forge.'
        : 'a sealed build that arrived as a card \u2014 the seal was recomputed here when it landed. Hatch the build itself in the Forge.',
      tier: (art && art.ok) ? 'proven' : r.manifest.assessor_pass ? 'proven' : 'prototype',
      rarity: (art && art.ok && r.bundle.tier) ? r.bundle.tier : (r.manifest.rarity || 'normal'),
      reach: [], // un-hatched, it can read, change, send and spend nothing \u2014 the good case, said plainly
      evidence: art && art.ok
        ? r.bundle.mint.kpid + ' \u00b7 four claims verified from the file, just now'
        : 'seal sha256:' + actual.slice(0, 12) + '\u2026 \u2014 recomputed on arrival, not taken on trust',
      kpid: (art && art.ok) ? r.bundle.mint.kpid : null,
      url: 'https://sjgant80-hub.github.io/fallkard-forge/',
    };
    me.cards = me.cards || [];
    me.cards.push(entry); byId.set(id, entry);
    me.bags.push(id); save();
    if (art && art.ok) {
      say('\u2713 SOVEREIGN ARTIFACT \u2014 ' + entry.name + ' is yours: build inside, tier earned, lineage signed \u2014 all verified here. ' + r.bundle.mint.kpid);
    } else if (art) {
      const failed = art.checks.find(c => !c.ok);
      say('\u2713 The card is real and sealed \u2014 yours \u2014 but its ARTIFACT layer was refused: ' + (failed ? failed.why : 'a claim did not hold') + '. It lands as a plain card.');
    } else {
      say('\u2713 Real and sealed \u2014 ' + entry.name + ' is yours now. Fit it like any tool, or hatch the build in the Forge.');
    }
    draw();
  } catch (e) { say('Could not read that: ' + ((e && e.message) || e)); }
}

// read. Each opens when the thing that makes it make sense has been done — and a shut one says what
// would open it, so nothing is ever mysteriously missing.
// ⚑ WHAT IS NOT OPEN IS NOT DRAWN. Greying out six panels is the same as showing somebody six
// panels: they still have to look at each one and work out that they cannot have it. At level one
// you do not see the raid finder faded — it is not there, and it arrives with a moment.
let shown = new Set();
function drawNav() {
  const n = $('#nav'); n.replaceChildren();
  const open = new Set(where(me).open);
  for (const p of PANELS) {
    if (!open.has(p.id)) continue;
    const b = el('button', p.id === at ? 'on' : '');
    b.type = 'button'; b.title = `${p.lb} (${p.key})`;
    b.append(el('span', 'ic', p.ic), el('span', 'lb', p.lb), el('span', 'k', p.key));
    b.addEventListener('click', () => { at = p.id; draw(); });
    n.append(b);
  }
  // The moment. Nothing arrives silently — you are told what you just got, once.
  const fresh = [...open].filter(x => !shown.has(x));
  if (shown.size && fresh.length) {
    const names = fresh.map(x => (PANELS.find(p => p.id === x) || {}).lb).filter(Boolean);

  shown = open;
}

// ── running an addon, boxed ───────────────────────────────────────────────────────────────────
//
// ⚑ THE BOX IS REAL, NOT A CONVENTION. The addon runs inside a sandboxed frame with its own content
// policy set to allow NOTHING from anywhere: it cannot fetch, cannot load an image, cannot open a
// socket. `sandbox="allow-scripts"` and no allow-same-origin means it has no access to this page,
// no storage, no keys, no DOM of ours. The only thing it can do is send a message, and every
// message goes through the wall before anything happens.
//
// ⚑ AND WHAT IT TRIED IS KEPT. An addon reaching for something outside its grant once may be a bug.
// Reaching forty times is the thing telling you what it was built for, and that record is the whole
// reason to run somebody else's code at all.
const RUNNING = new Map();

function boxFor(code) {
  // default-src 'none' is the wall. Nothing loads, nothing connects, nothing leaves.
  return `<!doctype html><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'">
<script>
const send = (m) => parent.postMessage(m, '*');
const ask = (what, detail) => new Promise((ok) => {
  const id = Math.random().toString(36).slice(2);
  addEventListener('message', function onr(e) {
    if (!e.data || e.data.id !== id) return;
    removeEventListener('message', onr); ok(e.data);
  });
  send({ kind: 'ask', id, what, detail });
});
const say = (t) => send({ kind: 'say', text: String(t) });
addEventListener('error', (e) => send({ kind: 'broke', text: String(e.message) }));
(async () => { try { ${code} } catch (e) { send({ kind: 'broke', text: String(e && e.message || e) }); } })();
<\/script>`;
}

function runAddon(a, code, onEvent) {
  const w = watch(a.id, a.reach);
  RUNNING.set(a.id, w);
  let n = 0;

  const frame = document.createElement('iframe');
  frame.sandbox = 'allow-scripts';          // no allow-same-origin: it cannot touch this page
  frame.style.display = 'none';
  frame.srcdoc = boxFor(code);

  const onMsg = (e) => {
    if (e.source !== frame.contentWindow || !e.data) return;
    const m = e.data;
    if (m.kind === 'say') return onEvent({ kind: 'say', text: String(m.text).slice(0, 400) });
    if (m.kind === 'broke') return onEvent({ kind: 'broke', text: String(m.text).slice(0, 200) });
    if (m.kind !== 'ask') return;

    const d = ask(w, { what: m.what, detail: m.detail }, n++);
    onEvent({ kind: 'ask', what: m.what, allowed: d.allow, why: d.why, detail: m.detail });

    // Only what the wall allowed is ever actually done, and even then only the host does it.
    let data = null;
    if (d.allow && m.what === 'read') data = { notes: me.last || '' };
    frame.contentWindow.postMessage({ id: m.id, allowed: d.allow, why: d.why, data }, '*');
  };

  addEventListener('message', onMsg);
  document.body.append(frame);
  return {
    watcher: w,
    stop() { removeEventListener('message', onMsg); frame.remove(); },
  };
}

// ── talking to a model you pay for ────────────────────────────────────────────────────────────
//
// ⚑ THE MODEL PHRASES; IT NEVER DECIDES. fall-os's t1 organ takes an injected generate function and
// returns PHRASINGS keyed to branches whose score, order and label were already fixed by t0. A model
// that tries to invent a stance, reorder the list or award itself the win cannot move anything,
// because nothing it says is ever read as a number. That property is fall-os's, already gated, and
// it is the reason a rented model can be let anywhere near this at all.
async function askModel(providerId, system, user) {
  const key = me.keys[providerId];
  if (!key) throw new Error(`no ${providerId} key`);
  const { url, init } = buildCall(providerId, key, { system, user });

  // Checked immediately before the fetch, every time. This is the one thing that must never be
  // wrong, so it is verified at the moment of sending rather than trusted from construction.
  const going = goingTo(providerId, url);
  if (!going.ok) throw new Error(going.why);

  let res;
  try { res = await fetch(url, init); }
  catch (e) {
    throw new Error(`could not reach ${providerOf(providerId).name} (${e.message}). Nothing was sent anywhere else.`);
  }
  let body = null;
  try { body = await res.json(); } catch { body = null; }
  if (!res.ok) throw new Error(explainStatus(providerId, res.status));
  const out = readReply(providerId, body);
  if (!out.ok) throw new Error(out.why);
  return out.text;
}


// ⚑ FITTING A TOOL IS REGISTERING AN ORGAN. Not a metaphor and not a picture of one: this calls the
// same function fall-os names `train` — you train a didy by registering its organs. Take one out and
// the didy genuinely cannot do that thing any more, because the conductor is rebuilt without it.
function fit(id, slot) {
  const a = byId.get(id);
  if (!a || !me.bags.includes(id)) { say('You do not own that one yet.'); return; }
  me.slots = me.slots || [null, null, null, null, null, null];
  if (me.slots.includes(id)) { say(a.name + ' is already fitted.'); return; }
  me.slots[slot] = id;
  save(); draw();
  say(a.name + ' fitted — your didy can do that now.');
}

// Built fresh every time, so a tool you pulled out is really gone. A didy that remembers an organ
// you removed is lying about what it can do.
function myDidy(asked) {
  const d = makeDidy('fallworld');
  register(d, 't0', t0Organ(asked));
  for (const id of (me.slots || []).filter(Boolean)) {
    const a = byId.get(id);
    if (a) register(d, a.id, { phase: 'explore', from: a.name, does: a.does });
  }
  return d;
}

// The right-hand side of the cockpit: what your didy is, what it is carrying, and what it has cost.
function drawRig() {
  const fitted = (me.slots || []).map(id => (id ? byId.get(id) : null));
  const on = fitted.filter(Boolean);
  const rig = el('div', 'rig' + (on.length ? ' powered' : ''));
  rig.append(el('div', 'who', 'your didy'));
  const ring = el('div', 'ring'); ring.textContent = '\u25c8'; rig.append(ring);

  const can = el('div', 'can');
  can.innerHTML = on.length
    ? 'it can also <b>' + on.map(a => esc(a.does.split(/[.\u00b7]/)[0].trim().toLowerCase()).slice(0, 46)).join('</b>, <b>') + '</b>'
    : 'right now it reads your words and lays out your options. Drag something in to give it more.';
  rig.append(can);

  const slots = el('div', 'slots');
  fitted.forEach((a, i) => {
    const d = el('div', 'slot' + (a ? ' filled' : ''));
    if (a) {
      d.append(el('div', 'fn', a.name));
      const pull = el('button', 'pull', 'take out'); pull.type = 'button';
      pull.addEventListener('click', () => {
        me.slots[i] = null; save(); draw();
        say(a.name + ' taken out. Your didy cannot do that any more.');
      });
      d.append(pull);
    } else d.textContent = on.length ? 'empty' : 'drag or tap a tool below to fit it here';
    d.addEventListener('dragover', (ev) => { ev.preventDefault(); d.classList.add('over'); });
    d.addEventListener('dragleave', () => d.classList.remove('over'));
    d.addEventListener('drop', (ev) => { ev.preventDefault(); d.classList.remove('over'); fit(ev.dataTransfer.getData('text/plain'), i); });
    slots.append(d);
  });
  rig.append(slots);

  // stats, read off what actually happened
  const t = tally(me.ran);
  const st = el('div', 'stats');
  const line = (k, v, cls) => { const r = el('div', 'stat'); r.append(el('span', null, k)); const b = el('b', cls || null, v); r.append(b); return r; };
  // ⚑ Six zeros is not a scoreboard, it is a broken-looking screen. Numbers arrive when there is
  // something to count; before that the panel says what it is for instead.
  if (!t.runs && !on.length) {
    st.append(el('div', 'quiet', 'Once you have run something, this is where what it cost you shows up.'));
    rig.append(st);
    return rigTail(rig, on);
  }
  st.append(line('jobs run', String(t.runs)));
  st.append(line('on your machine', String(t.yours), 'm'));
  st.append(line('rented', String(t.rented), t.rented ? 'r' : null));
  st.append(line('spent', String(t.spent), t.spent ? 'r' : null));
  st.append(line('tools fitted', on.length + '/6'));
  // ⚑ THE NUMBER THAT GOES UP. Power is what you have assembled: each tool your didy carries is one
  // more thing it can do without renting. It is the reason to keep adding, and it is honest — it
  // counts what is actually in the slots, not what you own and left in a drawer.
  st.append(line('power', String(on.length * 10 + t.yours), 'm'));
  rig.append(st);

  return rigTail(rig, on);
}

// What you own but have not fitted — the things you drag. Split out so the panel can return early
// when there is nothing worth counting yet and still offer the tools.
function rigTail(rig, on) {
  const spare = owned().filter(a => !(me.slots || []).includes(a.id));
  const tools = el('div', 'tools');
  if (!spare.length) {
    tools.append(el('div', 'quiet', owned().length ? 'Everything you own is fitted.' : 'Nothing to fit yet — the store fills this.'));
  }
  for (const a of spare) {
    const tl = el('div', 'tool ' + (a.tier || 'prototype') + ' n-' + (a.rarity || 'normal'));
    tl.draggable = true;
    tl.append(el('div', 'tn', a.name), el('div', 'grab', 'drag into a slot \u00b7 or just tap it'));
    tl.addEventListener('dragstart', (ev) => { ev.dataTransfer.setData('text/plain', a.id); tl.classList.add('dragging'); });
    tl.addEventListener('dragend', () => tl.classList.remove('dragging'));
    // No drag on a phone: a tap drops it into the first free slot instead.
    tl.addEventListener('click', () => {
      const free = (me.slots || []).findIndex(x => !x);
      if (free < 0) { say('Every slot is full — take one out first.'); return; }
      fit(a.id, free);
    });
    tools.append(tl);
  }
  rig.append(tools);
  return rig;
}

// ── running the real conductor ────────────────────────────────────────────────────────────────
async function probeLocal() {
  try {
    const r = await fetch('http://127.0.0.1:11434/api/tags', { signal: AbortSignal.timeout(2000) });
    return r.ok;
  } catch { return false; }
}

function runDidy(what, out, where) {
  const asked = String(what || '').trim();
  if (!asked) { say('Tell it what you are deciding first.'); return; }
  me.last = asked; save();

  // Where would this run? Asked before anything happens, and shown either way.
  const decision = route(asked, me, { mind: 0 });
  out.replaceChildren();

  // ⚑ The conductor itself needs no model at all: t0 is deterministic. So the page always works,
  // key or no key — and the rung only decides whether it can also be put into better words.
  const organ = t0Organ(asked);
  const didy = myDidy(asked);
  const run = conduct(didy, asked, { n: 6 });
  const carrying = Object.keys(didy.organs).filter(k => k !== 't0');
  const ev = organ.evidence;

  me.ran.push({ rung: 't0', mind: 0, cost: 0 });
  save();

  const note = el('div', 'note');
  note.textContent = summarise(run.field, ev)
    + (carrying.length ? ' Your didy used ' + carrying.length + ' of your own tools on this.' : '');
  out.append(note);

  if (!ev.found) {
    out.append(el('div', 'note', 'It found no signals it could name in that. Say more about what is at stake — what it costs, who it affects, what happens if it goes wrong — and the ranking will change.'));
  }

  out.append(el('h3', null, 'ways you could go'));
  const held_ = run.field.holds || [];
  const roads = run.field.roads || [];
  held_.forEach((h, i) => out.append(stanceCard(h, i === 0 ? 'top' : 'held', ev)));
  if (roads.length) {
    out.append(el('h3', null, 'set aside — and why that matters'));
    out.append(el('div', 'note', 'These did not clear the bar on your own words. They are kept, not deleted: the road you nearly took is the thing you want back when the first one fails.'));
    for (const r of roads) out.append(stanceCard(r, 'road', ev));
  }

  // The field is already complete and useful. A model, if you have one, only says it better — so it
  // is offered as a second step rather than blocking the first.
  const canPhrase = reach(me).t2;
  if (canPhrase && held_.length) {
    const rowP = el('div', 'row');
    const better = el('button', 'act', 'put this in my own terms'); better.type = 'button';
    const cost = el('span', 'quiet');
    const paid = route(asked, me, { mind: 2 });
    cost.textContent = paid.yours ? 'free — runs on your machine' : `this one costs money · ${paid.name}`;
    rowP.append(better, cost);
    out.append(rowP);
    better.addEventListener('click', async () => {
      better.disabled = true; better.textContent = 'asking…';

      // ⚑ phrase() takes ONE prompt and NEVER throws — it catches the failure and reports it in
      // `note`. So there is nothing to wrap: fall-os is already being honest about what happened,
      // and the job here is to repeat it rather than invent a friendlier version.
      const r = await phrase(asked, held_, ev, (prompt) => askModel(paid.provider, SYSTEM, prompt));

      // Only rows the model actually rewrote get a new line. Anything it echoed back keeps the
      // built-in wording, because an echo is the characteristic failure that most looks like success.
      const cards = [...out.querySelectorAll('.stance.top, .stance.held')];
      r.rows.forEach((row, i) => {
        if (!row.phrased || !cards[i]) return;
        const line = el('div', 'm');
        line.style.color = 'var(--ink)';
        line.textContent = row.phrased;
        cards[i].append(line);
      });

      if (r.failed) {
        better.disabled = false; better.textContent = 'try again';
        // Nothing was charged for a call that never landed, and nothing was sent anywhere else.
        say(r.note);
        return;
      }

      me.ran.push({ rung: paid.rung, mind: 2, cost: paid.cost }); save(); drawTop();
      better.textContent = 'done';
      say(`${r.note}. Nothing it wrote changed a single score — every one of those was fixed before it was asked.`);
    });
  }

  // ⚑ THE OFFER IS ONLY MADE WHERE IT HAS BEEN EARNED. Every line is attached to a thing this
  // person has actually just done — telling somebody they watched work come home when they never
  // ran anything locally is the same lie the rest of this refuses.
  // caption(me): the offer, only where it has been EARNED. Nothing ran yet = no offer at all;
  // mostly-local runs earn the "this is how the estate is built" line; rented runs earn the
  // "built once and owned" line. Both say only what the tally actually shows.
  function caption(m) {
    const t = tally(m.ran);
    if (!t.runs) return null;
    if (t.sovereignty !== null && t.sovereignty >= 0.5) return {
      says: 'Most of what you just ran happened on your own machine — nothing rented, nothing leaving.',
      then: 'The whole estate is built this way. See what that looks like as a service →',
      href: 'https://www.ai-nativesolutions.com/offerings.html',
      terms: 'one-off builds · you own the result · nothing recurring',
    };
    return {
      says: 'What you just ran cost a rented call. It works — and it never stops costing.',
      then: 'The same jobs, built once and owned — see the offerings →',
      href: 'https://www.ai-nativesolutions.com/offerings.html',
      terms: 'one-off builds · you own the result · nothing recurring',
    };
  }
  // what si-didy remembers about THIS question and THIS rig — provenance on every line
  if (MINDFILE) {
    const remembered = associatesFor(MINDFILE, asked, (me.slots || []).filter(Boolean), 4);
    const wonders = wondersOf(MINDFILE, 1);
    if (remembered.length || wonders.length) {
      const mb = el('div', 'remembers');
      if (remembered.length) {
        mb.append(el('div', 'rh', 'your didy remembers'));
        for (const r2 of remembered) {
          const line = el('div', 'rl');
          line.innerHTML = '<b>' + esc(r2.to) + '</b> runs close to <b>' + esc(r2.from) + '</b>'
            + (r2.at ? ' \u00b7 studied ' + esc(r2.at) : '')
            + (r2.via ? ' <span class="rv">\u00b7 learned via: ' + esc(r2.via) + '</span>' : '');
          mb.append(line);
        }
      }
      for (const wnd of wonders) {
        mb.append(el('div', 'rw', 'si-didy wonders whether ' + wnd.root + ' relates to ' + wnd.node + ' \u2014 a dream held open, unconfirmed'));
      }
      out.append(mb);
    }
  }
  const b = caption(me);
  if (b) {
    const box = el('div', 'bridge');
    box.append(el('div', 'l', b.says));
    const a = el('a'); a.href = b.href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = b.then;
    box.append(a);
    box.append(el('div', 't', b.terms));
    out.append(box);
  }

  drawTop(); drawNav(); drawNpc();
  where.innerHTML = decision.refused
    ? `<b class="r">${decision.refused}</b>`
    : decision.yours ? 'ran on <b>your machine</b> · free'
    : `ran on <b class="r">${decision.name}</b>`;
  say(`${held_.length} ways kept, ${roads.length} set aside — nothing is decided until you pick one.`);
}

function stanceCard(branch, kind, ev) {
  const v = branch.value || branch;
  const d = el('div', 'stance ' + kind);
  const h = el('div', 'h');
  h.append(el('span', 'n', v.label || v.stance || 'a way to go'));
  h.append(el('span', 'sc', typeof branch.score === 'number' ? branch.score.toFixed(2) : ''));
  d.append(h);
  if (v.move) d.append(el('div', 'm', v.move));

  // ⚑ SHOW THE WORDS, NOT THE CODE. The organ reports which SIGNALS moved a stance, by id — and an
  // id on the screen reads as "unknown", which is worse than saying nothing. The whole promise of
  // the tier-0 conductor is that every score traces back to a word you actually typed, so the words
  // are what goes on the card.
  const found = new Map(((ev && ev.signals) || []).map(sg => [sg.id, sg]));
  const said = (ids) => (ids || [])
    .map(id => found.get(id))
    .filter(Boolean)
    .map(sg => `${sg.label} (${sg.cues.join(', ')})`);
  const up = said(v.up), down = said(v.down);
  if (up.length) d.append(el('div', 'cue', 'counts for it: ' + up.join(' · ')));
  if (down.length) d.append(el('div', 'cue', 'counts against it: ' + down.join(' · ')));
  if (!up.length && !down.length) {
    d.append(el('div', 'cue', 'nothing in your words moved this either way — it is here on its default standing'));
  }

  if (kind !== 'road') {
    const b = el('button', 'pick', 'take this one'); b.type = 'button';
    b.addEventListener('click', () => {
      me.picked = (Number.isFinite(me.picked) ? me.picked : 0) + 1; save(); draw();
      say(`You took "${v.label || v.stance}". Nothing was decided for you — that was yours.`);
      d.classList.add('top');
      b.disabled = true; b.textContent = 'taken';
    });
    d.append(b);
  }
  return d;
}

function draw() {
  drawTop(); drawNav(); drawNpc();
  const p = $('#panel'); p.replaceChildren();
  if (!isOpen(me, at)) {
    // Never a dead end: it says exactly what would open it, and takes you back to doing that.
    const shutList = locked(me);
    const box = el('div', 'lockedNote');
    box.append(el('div', null, `Not open yet — ${shutList.opener[at] || 'keep going'}.`));
    const b = el('button', 'act', 'back to your didy'); b.type = 'button'; b.style.marginTop = '10px';
    b.addEventListener('click', () => { at = 'didy'; draw(); });
    box.append(b);
    p.append(box);
    return;
  }
  p.append((P[at] || P.didy)());
  document.querySelector('main').scrollTop = 0;
}

addEventListener('keydown', (e) => {
  if (e.target.matches('input,textarea')) return;
  const hit = PANELS.find(x => x.key.toLowerCase() === e.key.toLowerCase());
  if (hit) { at = hit.id; draw(); }
});

let prompt_ = null;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); prompt_ = e; });
// The download IS the point: your didy leaves the tab and lives on your machine. So the button is
// always visible — hiding it until Chrome volunteers a prompt meant most people never saw a way to
// keep it at all.
if (matchMedia('(display-mode: standalone)').matches) {
  $('#install').textContent = '\u2713 yours';
  $('#install').title = 'Already on your machine \u2014 this is the kept copy, and it works with no internet.';
} else {
  $('#install').textContent = '\u2b07 keep your didy';
  $('#install').title = 'Put it on your machine \u2014 it opens like an app and works with no internet.';
}
$('#install').addEventListener('click', async () => {
  if (matchMedia('(display-mode: standalone)').matches) {
    say('Already yours \u2014 this copy lives on your machine and works with no internet.');
    return;
  }
  if (prompt_) {
    prompt_.prompt(); const r = await prompt_.userChoice;
    say(r.outcome === 'accepted'
      ? 'Kept. Your didy now opens from your own machine and works with no internet \u2014 nothing to sign up for, nothing rented.'
      : 'No harm \u2014 it keeps working right here, and the button stays if you change your mind.');
    prompt_ = null;
    return;
  }
  // No native prompt in this browser - say exactly where ITS install lives.
  const ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/.test(ua)) {
    say('On iPhone or iPad: tap the Share button (the square with the arrow), then "Add to Home Screen". After that your didy opens like an app and works with no internet.');
  } else if (/Firefox/.test(ua)) {
    say('Firefox does not offer app installs on desktop \u2014 bookmark this page instead; it already works offline once visited. On Android Firefox: menu \u2192 "Install".');
  } else {
    say('In your browser\'s menu look for "Install app" or "Add to Home screen" \u2014 usually an icon at the right end of the address bar. After that your didy opens like an app and works with no internet.');
  }
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

draw();
say(`${SHOP.listed.length} things listed · ${SHOP.refused.length} refused for want of evidence · works with no key at all`);
</script>
