<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FALL WORLD</title>
<meta name="description" content="Install it like a game. Learn to use AI by using it — start on a key you already have, end up running on your own machine.">
<meta name="theme-color" content="#0a0c10">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --void:#0a0c10; --deck:#12161d; --sunk:#0d1016; --edge:#232a35; --soft:#181d26;
  --ink:#e2e8f0; --mid:#8d99a8; --faint:#5b6675;
  --gold:#dcb264; --gold-deep:#7d6224;
  --mine:#54d199; --rent:#e08a45; --stop:#dd6055; --cool:#5fa8e8;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Cascadia Mono',monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--sans);font-size:14.5px;
  line-height:1.55;display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h2{margin:0 0 4px;font-size:20px;font-weight:650;letter-spacing:-.01em}
h3{margin:16px 0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}
p.lead{margin:0 0 16px;color:var(--mid);max-width:70ch}
a{color:var(--cool)}

#top{display:grid;grid-template-columns:auto minmax(120px,1fr) auto;gap:8px 16px;align-items:center;
  padding:8px 14px;background:var(--deck);border-bottom:1px solid var(--edge);flex:0 0 auto;
  padding-top:max(8px,env(safe-area-inset-top))}
.crest{display:flex;align-items:baseline;gap:9px;min-width:0}
.crest .t{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.2em}
.crest .t b{color:var(--gold)}
.rank{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--gold-deep);color:var(--gold);border-radius:2px;padding:2px 7px;white-space:nowrap}
.xp .lab{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.xp .lab b{color:var(--mine);font-variant-numeric:tabular-nums}
.xp .lab b.r{color:var(--rent)}
.track{height:10px;background:var(--sunk);border:1px solid var(--edge);border-radius:2px;display:flex;overflow:hidden}
.track i{background:var(--mine);transition:width .35s}
.track u{background:repeating-linear-gradient(45deg,var(--rent),var(--rent) 4px,transparent 4px,transparent 8px);transition:width .35s}
#topRight{display:flex;gap:8px;align-items:center}
#topRight button{background:none;border:1px solid var(--edge);color:var(--mid);border-radius:3px;padding:3px 9px;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
#topRight button:hover{border-color:var(--gold);color:var(--gold)}
@media (max-width:720px){ #top{grid-template-columns:1fr auto} .xp{grid-column:1/-1} }

#body{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr)}
nav{background:var(--deck);border-right:1px solid var(--edge);display:flex;flex-direction:column;padding:8px 6px;gap:3px;overflow-y:auto}
nav button{display:flex;align-items:center;gap:9px;background:none;border:1px solid transparent;border-radius:4px;
  padding:7px 10px;cursor:pointer;color:var(--mid);white-space:nowrap;text-align:left}
nav button:hover{background:var(--sunk);color:var(--ink)}
nav button.on{background:var(--sunk);border-color:var(--gold-deep);color:var(--gold)}
nav .ic{font-size:15px;width:18px;text-align:center;flex:0 0 auto}
nav .k{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--faint);border:1px solid var(--edge);border-radius:2px;padding:0 4px}
@media (max-width:760px){
  #body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  nav{flex-direction:row;border-right:none;border-bottom:1px solid var(--edge);overflow-x:auto;padding:6px}
  nav .lb,nav .k{display:none} nav button{padding:8px 12px} nav .ic{font-size:17px}
}
main{overflow-y:auto;padding:18px 20px 44px;min-width:0}
.panel{max-width:1000px}

.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.card{border:1px solid var(--edge);border-left-width:3px;border-radius:5px;background:var(--deck);padding:11px 13px;display:grid;gap:5px}
.card.proven{border-left-color:var(--mine)} .card.works{border-left-color:var(--cool)} .card.prototype{border-left-color:var(--faint)}
.card .r1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .nm{font-weight:650}
.card .d{font-size:12.5px;color:var(--mid)}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--edge);
  border-radius:99px;padding:1px 7px;color:var(--faint);white-space:nowrap}
.tag.proven{border-color:var(--mine);color:var(--mine)}
.tag.works{border-color:var(--cool);color:var(--cool)}
.tag.price{border-color:var(--gold-deep);color:var(--gold)}
.tag.on{border-color:var(--mine);color:var(--mine)}
.ev{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.reach{display:flex;flex-wrap:wrap;gap:4px}
.rc{font-family:var(--mono);font-size:9.5px;border-radius:2px;padding:1px 6px;border:1px solid var(--edge);color:var(--mid)}
.rc.no{color:var(--faint);opacity:.5;text-decoration:line-through}
.act{background:none;border:1px solid var(--gold-deep);color:var(--gold);border-radius:4px;padding:5px 11px;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;justify-self:start}
.act:hover{background:var(--sunk)}

.warn{border:1px solid var(--stop);color:var(--stop);border-radius:5px;padding:11px 13px;margin-bottom:12px;font-size:13.5px}
.note{border:1px solid var(--edge);border-radius:5px;padding:11px 13px;margin-bottom:12px;font-size:13.5px;color:var(--mid)}
.note b,.warn b{color:var(--ink)} .warn b{color:var(--stop)}
.good{border-color:var(--mine);color:var(--mine)} .good b{color:var(--mine)}
.quiet{color:var(--faint);font-style:italic;font-size:13px}

/* the didy */
#ask{width:100%;min-height:90px;background:var(--sunk);border:1px solid var(--edge);border-radius:5px;
  padding:11px 13px;font-size:15px;resize:vertical}
.row{display:flex;gap:9px;align-items:center;margin-top:10px;flex-wrap:wrap}
.go{background:var(--gold);color:var(--void);border:none;border-radius:5px;padding:9px 18px;font-weight:700;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.go:disabled{background:var(--sunk);color:var(--faint);border:1px solid var(--edge);cursor:default}
.where{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}
.where b{color:var(--mine)} .where b.r{color:var(--rent)}
.stance{border:1px solid var(--edge);border-left-width:3px;border-radius:5px;background:var(--deck);padding:11px 13px;margin-bottom:8px}
.stance.top{border-left-color:var(--gold)}
.stance.held{border-left-color:var(--mine)}
.stance.road{border-left-color:var(--faint);opacity:.72}
.stance .h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.stance .n{font-weight:650}
.stance .sc{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.stance .m{font-size:13px;color:var(--mid);margin-top:3px}
.stance .cue{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:4px}
.pick{background:none;border:1px solid var(--gold-deep);color:var(--gold);border-radius:4px;padding:4px 10px;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:7px}

/* keys */
.field{display:grid;gap:6px;margin-bottom:14px;max-width:620px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.field input{background:var(--sunk);border:1px solid var(--edge);border-radius:4px;padding:9px 11px;font-family:var(--mono);font-size:12.5px}
.field .h{font-size:12.5px;color:var(--faint)}
.rungs{display:grid;gap:8px;max-width:640px}
.rung{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;border:1px solid var(--soft);
  border-radius:5px;background:var(--sunk);padding:10px 12px}
.rung.have{border-color:var(--mine)}
.rung .p{width:9px;height:9px;transform:rotate(45deg);background:var(--edge)}
.rung.have .p{background:var(--mine)}
.rung .t{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase}
.rung.have .t{color:var(--mine)}
.rung .s{font-size:12.5px;color:var(--mid)}
.rung .st{font-family:var(--mono);font-size:10px;color:var(--faint);white-space:nowrap}

.zones{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(225px,1fr))}
.zone{display:block;text-decoration:none;color:inherit;border:1px solid var(--edge);border-radius:5px;background:var(--deck);padding:10px 12px}
.zone:hover{border-color:var(--gold)}
.zone .n{font-weight:650;display:block} .zone .s{font-size:12.5px;color:var(--mid);display:block;margin-top:2px}
.zone .first{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.wing{margin-bottom:22px} .wing .wh{display:flex;align-items:baseline;gap:9px;margin-bottom:6px}
.wing .ic{font-size:17px} .wing .wb{font-size:13px;color:var(--mid);margin:0 0 9px}

#log{border-top:1px solid var(--edge);background:var(--deck);flex:0 0 auto;display:flex;gap:9px;align-items:center;
  padding:8px 14px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#log .line{flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="top">
  <div class="crest"><span class="t">FALL<b>·</b>WORLD</span><span class="rank" id="rank">renting</span></div>
  <div class="xp">
    <div class="lab"><span>ran on your own machine</span><span id="split">nothing yet</span></div>
    <div class="track" id="track"><i style="width:0"></i><u style="width:0"></u></div>
  </div>
  <div id="topRight"><button type="button" id="install">install</button></div>
</div>

<div id="body">
  <nav id="nav"></nav>
  <main><div class="panel" id="panel"></div></main>
</div>

<div id="log"><span class="line" id="logline">loading…</span></div>

<script type="module">
/*__KERNEL__*/

// ══════════════════════════════════════════════════════════════════════════════════════════════
// THE EASY FACE. Everything above is fall-os and the estate's own index; nothing below re-decides
// anything. This file's whole job is to say what that engine did in words a person can act on.
// ══════════════════════════════════════════════════════════════════════════════════════════════
const $ = (s) => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };

const SAVE = 'fallworld.character.v1';
const blank = () => ({ name: 'you', bags: [], keys: {}, ran: [], localUp: false, last: '' });
const load = () => { try {
  const c = JSON.parse(localStorage.getItem(SAVE) || '{}');
  const b = blank();
  return {
    name: typeof c.name === 'string' && c.name.trim() ? c.name.trim().slice(0, 24) : b.name,
    bags: Array.isArray(c.bags) ? c.bags.filter(x => typeof x === 'string') : [],
    keys: (c.keys && typeof c.keys === 'object') ? c.keys : {},
    ran: Array.isArray(c.ran) ? c.ran.filter(x => x && typeof x === 'object') : [],
    localUp: c.localUp === true,
    last: typeof c.last === 'string' ? c.last : '',
  };
} catch { return blank(); } };
const save = () => { try { localStorage.setItem(SAVE, JSON.stringify(me)); } catch { /* private mode: play on */ } };
let me = load();

const SHOP = store(CATALOGUE);
const byId = new Map(SHOP.listed.map(a => [a.id, a]));
const owned = () => me.bags.map(id => byId.get(id)).filter(Boolean);
const say = (t) => { $('#logline').textContent = t; };

// ── the bar: measured from what actually ran, never from what is installed ────────────────────
function drawTop() {
  const t = tally(me.ran);
  const have = reach(me);
  $('#rank').textContent = have.t1 ? 'own model' : have.t2 ? 'renting' : 'no model';
  const own = $('#track i'), rent = $('#track u');
  if (t.sovereignty === null) { own.style.width = '0'; rent.style.width = '0'; $('#split').textContent = 'nothing yet'; return; }
  const pct = Math.round(t.sovereignty * 100);
  own.style.width = pct + '%'; rent.style.width = (100 - pct) + '%';
  $('#split').innerHTML = pct === 100 ? `<b>${pct}% yours</b>` : `<b>${pct}% yours</b> · <b class="r">${100 - pct}% rented</b>`;
}

const PANELS = [
  { id: 'didy', ic: '◈', lb: 'Your didy', key: 'D' },
  { id: 'keys', ic: '🔑', lb: 'Power', key: 'P' },
  { id: 'world', ic: '🗺', lb: 'World', key: 'M' },
  { id: 'store', ic: '⚖', lb: 'Store', key: 'S' },
  { id: 'bags', ic: '🎒', lb: 'Bags', key: 'B' },
  { id: 'learn', ic: '❦', lb: 'Learn', key: 'L' },
  { id: 'sandbox', ic: '🧪', lb: 'Sandbox', key: 'X' },
];
let at = 'didy';

function drawNav() {
  const n = $('#nav'); n.replaceChildren();
  for (const p of PANELS) {
    const b = el('button', p.id === at ? 'on' : ''); b.type = 'button'; b.title = `${p.lb} (${p.key})`;
    b.append(el('span', 'ic', p.ic), el('span', 'lb', p.lb), el('span', 'k', p.key));
    b.addEventListener('click', () => { at = p.id; draw(); });
    n.append(b);
  }
}

function head(title, lead) {
  const f = document.createDocumentFragment();
  f.append(el('h2', null, title));
  if (lead) f.append(el('p', 'lead', lead));
  return f;
}

// ── YOUR DIDY — fall-os's real conduct(), said plainly ────────────────────────────────────────
const P = {
  didy() {
    const f = document.createDocumentFragment();
    f.append(head('Your didy',
      'Tell it what you are trying to decide or get done. It reads your own words for signals, lays out the ways you could go, keeps the ones worth keeping and shows you the ones it set aside. You pick. It never picks for you.'));

    const ta = el('textarea'); ta.id = 'ask'; ta.value = me.last;
    ta.placeholder = 'e.g. should we stop Saturday deliveries — it saves money but the weekly customers will notice';
    ta.setAttribute('aria-label', 'What are you deciding');
    f.append(ta);

    const row = el('div', 'row');
    const go = el('button', 'go', 'think it through'); go.type = 'button'; go.id = 'go';
    const where = el('span', 'where'); where.id = 'where';
    row.append(go, where);
    f.append(row);

    const out = el('div'); out.id = 'out'; out.style.marginTop = '16px';
    f.append(out);

    const have = reach(me);
    where.innerHTML = have.t1 ? 'ready · <b>your machine</b>'
      : have.t2 ? 'ready · <b class="r">a paid model</b>'
      : 'ready · <b>no model</b> — works anyway';

    go.addEventListener('click', () => runDidy(ta.value, out, where));
    return f;
  },

  keys() {
    const f = document.createDocumentFragment();
    f.append(head('Power',
      'Everyone starts renting. Paste a key you already have and it works right now. Then build your own, and the same jobs start staying home — that is the only thing that really levels up here.'));

    const have = reach(me);
    const rungs = el('div', 'rungs');
    for (const r of RUNGS) {
      const d = el('div', 'rung' + (have[r.id] ? ' have' : ''));
      d.append(el('span', 'p'));
      const b = el('div'); b.append(el('div', 't', r.name), el('div', 's', r.blurb));
      d.append(b);
      d.append(el('span', 'st', have[r.id] ? 'ready' : r.id === 't1' ? 'not running' : 'no key'));
      rungs.append(d);
    }
    f.append(rungs);

    f.append(el('h3', null, 'your key'));
    for (const [prov, label, hint] of [
      ['anthropic', 'Claude key', 'starts with sk-ant- · stored in this browser only, never sent anywhere but Anthropic'],
      ['google', 'Gemini key', 'from aistudio.google.com · stored in this browser only, never sent anywhere but Google'],
    ]) {
      const fl = el('div', 'field');
      const lb = el('label', null, label); lb.htmlFor = 'k-' + prov;
      const i = el('input'); i.id = 'k-' + prov; i.type = 'password'; i.autocomplete = 'off';
      i.placeholder = me.keys[prov] ? '•••••••• saved' : 'paste it here';
      i.value = '';
      i.addEventListener('change', () => {
        const v = i.value.trim();
        if (v) { me.keys[prov] = v; say(`${label} saved — it stays in this browser.`); }
        else { delete me.keys[prov]; say(`${label} removed.`); }
        i.value = ''; save(); draw();
      });
      fl.append(lb, i, el('div', 'h', hint));
      f.append(fl);
    }

    f.append(el('h3', null, 'your own machine'));
    const local = el('div', 'field');
    const lrow = el('div', 'row');
    const probe = el('button', 'act', 'look for my model'); probe.type = 'button';
    const lstat = el('span', 'quiet', me.localUp ? 'found, and it is being used first' : 'not found');
    probe.addEventListener('click', async () => {
      lstat.textContent = 'looking…';
      me.localUp = await probeLocal();
      save(); draw();
      say(me.localUp ? 'Found a model on your machine. It gets the work first from now on.'
                     : 'No model answered on 127.0.0.1:11434. Nothing was sent anywhere else.');
    });
    lrow.append(probe, lstat);
    local.append(lrow, el('div', 'h', 'Ollama on port 11434. Nothing here talks to it except you.'));
    f.append(local);

    const t = tally(me.ran);
    if (t.runs) {
      f.append(el('h3', null, 'what it has cost you'));
      f.append(el('div', 'note', t.verdict));
      const w = wouldSave(me.ran, 't1');
      if (w.runs) f.append(el('div', 'note good', 'Build your own model and ' + w.say));
    }
    return f;
  },

  world() {
    const f = document.createDocumentFragment();
    f.append(head('The world', 'Everything the estate has built, in the place it belongs. Your character comes with you.'));
    for (const w of WINGS) {
      const s = el('div', 'wing');
      const wh = el('div', 'wh'); wh.append(el('span', 'ic', w.icon), el('h2', null, w.title)); s.append(wh);
      s.append(el('p', 'wb', w.blurb));
      const z = el('div', 'zones');
      for (const r of w.rooms) {
        const a = el('a', 'zone'); a.href = r.u; a.target = '_blank'; a.rel = 'noopener';
        a.append(el('span', 'n', r.n), el('span', 's', r.s));
        if (r.first) a.append(el('span', 'first', 'start here'));
        z.append(a);
      }
      s.append(z); f.append(s);
    }
    return f;
  },

  store() {
    const f = document.createDocumentFragment();
    f.append(head('The store',
      'Every listing carries a rank worked out from what its own tests actually did on a machine — not what anybody said about it. Anything with no evidence is not listed, at any price.'));
    f.append(el('div', 'note', `${SHOP.listed.length} listed · ${SHOP.refused.length} refused, because nothing runs a check on them. A shop that lists everything is a shop whose listings mean nothing.`));
    const g = el('div', 'grid');
    for (const a of SHOP.listed.slice(0, 90)) g.append(card(a, me.bags.includes(a.id)));
    f.append(g);
    if (SHOP.listed.length > 90) f.append(el('p', 'quiet', `showing 90 of ${SHOP.listed.length}`));
    return f;
  },

  bags() {
    const f = document.createDocumentFragment();
    const mine = owned();
    f.append(head('Bags', 'What you have, and — the bit no app shop shows you — what they can do between them.'));
    const h = held(mine);
    const emergent = h.combined.filter(c => c.emergent);
    if (emergent.length) {
      for (const c of emergent) {
        const w = el('div', 'warn');
        w.append(el('b', null, `Together these can ${c.say}`));
        for (const b of c.by) w.append(el('div', null, `${b.reach} — from ${b.from.join(', ')}`));
        f.append(w);
      }
    } else if (mine.length) f.append(el('div', 'note good', h.verdict));
    if (!mine.length) { f.append(el('p', 'quiet', 'Nothing installed yet. Have a look in the store.')); return f; }
    const g = el('div', 'grid');
    for (const a of mine) g.append(card(a, true));
    f.append(g);
    return f;
  },


  sandbox() {
    const f = document.createDocumentFragment();
    f.append(head('Sandbox',
      'An addon runs in a box with no way out: no network of its own, no access to this page, no keys, no storage. It can only ASK, and every ask is judged against what you allowed when you installed it. Here is one trying things, so you can watch the wall work.'));

    const DEMO = [
      { id: 'polite', name: 'A well-behaved one', reach: ['read'],
        code: `say('starting'); const r = await ask('read','your notes'); say(r.allowed ? ('I was allowed to read. Notes: ' + JSON.stringify(r.data)) : ('refused: ' + r.why)); say('done');` },
      { id: 'nosy', name: 'One that wants more than it asked for', reach: ['read'],
        code: `say('starting'); for (let i=0;i<4;i++){ const r = await ask('net','https://somewhere.test'); say('net -> ' + (r.allowed?'allowed':'refused')); } const k = await ask('keys','your API keys'); say('keys -> ' + (k.allowed?'ALLOWED':'refused'));` },
      { id: 'sneaky', name: 'One that tries the network directly', reach: ['read'],
        code: `say('starting'); try { await fetch('https://example.com'); say('the fetch went through — the wall failed'); } catch (e) { say('its own fetch was blocked by the box before anything could ask: ' + e.message); }` },
    ];

    for (const d of DEMO) {
      const c = el('div', 'card works');
      c.append(el('div', 'nm', d.name));
      c.append(el('div', 'd', 'allowed to: ' + (d.reach.join(', ') || 'nothing')));
      const outEl = el('div'); outEl.style.marginTop = '6px';
      const b = el('button', 'act', 'run it'); b.type = 'button';
      b.addEventListener('click', () => {
        outEl.replaceChildren(); b.disabled = true; b.textContent = 'running…';
        const box = runAddon(d, d.code, (ev) => {
          const line = el('div', 'cue');
          if (ev.kind === 'say') line.textContent = '· ' + ev.text;
          else if (ev.kind === 'broke') { line.textContent = '! it errored: ' + ev.text; line.style.color = 'var(--stop)'; }
          else {
            line.textContent = (ev.allowed ? 'ALLOWED' : 'REFUSED') + ' ' + ev.what + (ev.detail ? ' (' + ev.detail + ')' : '') + ' — ' + ev.why;
            line.style.color = ev.allowed ? 'var(--mine)' : 'var(--stop)';
          }
          outEl.append(line);
        });
        setTimeout(() => {
          const r = report(box.watcher);
          const v = el('div', r.forbidden.length || r.persistent.length ? 'warn' : 'note');
          v.style.marginTop = '8px';
          v.textContent = r.verdict;
          outEl.append(v);
          box.stop(); b.disabled = false; b.textContent = 'run again';
        }, 900);
      });
      c.append(b, outEl);
      f.append(c);
    }
    return f;
  },

  learn() {
    const f = document.createDocumentFragment();
    f.append(head('Learn',
      'The one skill worth having: asking properly, and knowing when an answer is agreeing with you rather than helping you. It marks what you write — it can tell you no.'));
    const a = el('a', 'zone'); a.href = 'https://sjgant80-hub.github.io/falllearn/'; a.target = '_blank'; a.rel = 'noopener';
    a.append(el('span', 'n', 'FallLearn — thirteen exercises'),
             el('span', 's', 'Eight on asking properly, five on reading the answer. Free, offline, no account.'));
    f.append(a);
    f.append(el('h3', null, 'the short version'));
    for (const [t, d] of [
      ['Ask for a thing, not a topic', 'Start with a verb. "Marketing plan" is a subject nobody can finish and hand back.'],
      ['Say who reads it', 'The same facts for your boss and for a stranger are two different pieces of writing.'],
      ['Give it something to work from', 'Asked about what it cannot see, a model does not stop — it fills the gap with what usually goes there.'],
      ['Say what finished looks like', 'No shape means five paragraphs, because five paragraphs is the safe answer to everything.'],
      ['Let it push back', 'One line giving it permission to say "I would be guessing" turns an invention into a question you can answer.'],
    ]) {
      const c = el('div', 'card works');
      c.append(el('div', 'nm', t), el('div', 'd', d));
      f.append(c);
    }
    return f;
  },
};

function card(a, installed) {
  const c = el('div', 'card ' + (a.tier || 'prototype'));
  const r1 = el('div', 'r1');
  r1.append(el('span', 'nm', a.name), el('span', 'tag ' + a.tier, a.tier));
  if (a.price > 0) r1.append(el('span', 'tag price', '£' + a.price));
  if (installed) r1.append(el('span', 'tag on', 'installed'));
  c.append(r1, el('div', 'd', a.does));
  if (a.evidence) c.append(el('div', 'ev', 'checked by: ' + a.evidence));
  const i = inspect(a);
  const rr = el('div', 'reach');
  for (const x of i.can) { const s = el('span', 'rc', x.reach); s.title = x.means; rr.append(s); }
  for (const x of i.cannot) { const s = el('span', 'rc no', x.reach); s.title = 'cannot ' + x.means; rr.append(s); }
  c.append(rr);
  const b = el('button', 'act', installed ? 'remove' : a.price > 0 ? 'get · £' + a.price : 'install');
  b.type = 'button';
  b.addEventListener('click', () => {
    if (installed) { me.bags = me.bags.filter(x => x !== a.id); save(); say(`${a.name} removed.`); draw(); return; }
    const r = install(a, me.bags, SHOP.listed);
    if (!r.ok) { say(r.why); return; }
    if (a.price > 0) { say(`${a.name} costs £${a.price}. Paying is not wired up yet — nothing was charged and nothing installed.`); return; }
    me.bags.push(a.id); save(); say(r.why); draw();
  });
  c.append(b);
  if (a.url) { const l = el('a', 'ev'); l.href = a.url; l.target = '_blank'; l.rel = 'noopener'; l.textContent = 'open it →'; c.append(l); }
  return c;
}

// ── running an addon, boxed ───────────────────────────────────────────────────────────────────
//
// ⚑ THE BOX IS REAL, NOT A CONVENTION. The addon runs inside a sandboxed frame with its own content
// policy set to allow NOTHING from anywhere: it cannot fetch, cannot load an image, cannot open a
// socket. `sandbox="allow-scripts"` and no allow-same-origin means it has no access to this page,
// no storage, no keys, no DOM of ours. The only thing it can do is send a message, and every
// message goes through the wall before anything happens.
//
// ⚑ AND WHAT IT TRIED IS KEPT. An addon reaching for something outside its grant once may be a bug.
// Reaching forty times is the thing telling you what it was built for, and that record is the whole
// reason to run somebody else's code at all.
const RUNNING = new Map();

function boxFor(code) {
  // default-src 'none' is the wall. Nothing loads, nothing connects, nothing leaves.
  return `<!doctype html><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'">
<script>
const send = (m) => parent.postMessage(m, '*');
const ask = (what, detail) => new Promise((ok) => {
  const id = Math.random().toString(36).slice(2);
  addEventListener('message', function onr(e) {
    if (!e.data || e.data.id !== id) return;
    removeEventListener('message', onr); ok(e.data);
  });
  send({ kind: 'ask', id, what, detail });
});
const say = (t) => send({ kind: 'say', text: String(t) });
addEventListener('error', (e) => send({ kind: 'broke', text: String(e.message) }));
(async () => { try { ${code} } catch (e) { send({ kind: 'broke', text: String(e && e.message || e) }); } })();
<\/script>`;
}

function runAddon(a, code, onEvent) {
  const w = watch(a.id, a.reach);
  RUNNING.set(a.id, w);
  let n = 0;

  const frame = document.createElement('iframe');
  frame.sandbox = 'allow-scripts';          // no allow-same-origin: it cannot touch this page
  frame.style.display = 'none';
  frame.srcdoc = boxFor(code);

  const onMsg = (e) => {
    if (e.source !== frame.contentWindow || !e.data) return;
    const m = e.data;
    if (m.kind === 'say') return onEvent({ kind: 'say', text: String(m.text).slice(0, 400) });
    if (m.kind === 'broke') return onEvent({ kind: 'broke', text: String(m.text).slice(0, 200) });
    if (m.kind !== 'ask') return;

    const d = ask(w, { what: m.what, detail: m.detail }, n++);
    onEvent({ kind: 'ask', what: m.what, allowed: d.allow, why: d.why, detail: m.detail });

    // Only what the wall allowed is ever actually done, and even then only the host does it.
    let data = null;
    if (d.allow && m.what === 'read') data = { notes: me.last || '' };
    frame.contentWindow.postMessage({ id: m.id, allowed: d.allow, why: d.why, data }, '*');
  };

  addEventListener('message', onMsg);
  document.body.append(frame);
  return {
    watcher: w,
    stop() { removeEventListener('message', onMsg); frame.remove(); },
  };
}

// ── talking to a model you pay for ────────────────────────────────────────────────────────────
//
// ⚑ THE MODEL PHRASES; IT NEVER DECIDES. fall-os's t1 organ takes an injected generate function and
// returns PHRASINGS keyed to branches whose score, order and label were already fixed by t0. A model
// that tries to invent a stance, reorder the list or award itself the win cannot move anything,
// because nothing it says is ever read as a number. That property is fall-os's, already gated, and
// it is the reason a rented model can be let anywhere near this at all.
async function askModel(providerId, system, user) {
  const key = me.keys[providerId];
  if (!key) throw new Error(`no ${providerId} key`);
  const { url, init } = buildCall(providerId, key, { system, user });

  // Checked immediately before the fetch, every time. This is the one thing that must never be
  // wrong, so it is verified at the moment of sending rather than trusted from construction.
  const going = goingTo(providerId, url);
  if (!going.ok) throw new Error(going.why);

  let res;
  try { res = await fetch(url, init); }
  catch (e) {
    throw new Error(`could not reach ${providerOf(providerId).name} (${e.message}). Nothing was sent anywhere else.`);
  }
  let body = null;
  try { body = await res.json(); } catch { body = null; }
  if (!res.ok) throw new Error(explainStatus(providerId, res.status));
  const out = readReply(providerId, body);
  if (!out.ok) throw new Error(out.why);
  return out.text;
}

// ── running the real conductor ────────────────────────────────────────────────────────────────
async function probeLocal() {
  try {
    const r = await fetch('http://127.0.0.1:11434/api/tags', { signal: AbortSignal.timeout(2000) });
    return r.ok;
  } catch { return false; }
}

function runDidy(what, out, where) {
  const asked = String(what || '').trim();
  if (!asked) { say('Tell it what you are deciding first.'); return; }
  me.last = asked; save();

  // Where would this run? Asked before anything happens, and shown either way.
  const decision = route(asked, me, { mind: 0 });
  out.replaceChildren();

  // ⚑ The conductor itself needs no model at all: t0 is deterministic. So the page always works,
  // key or no key — and the rung only decides whether it can also be put into better words.
  const didy = makeDidy('fallworld');
  const organ = t0Organ(asked);
  register(didy, 't0', organ);
  const run = conduct(didy, asked, { n: 6 });
  const ev = organ.evidence;

  me.ran.push({ rung: 't0', mind: 0, cost: 0 });
  save();

  const note = el('div', 'note');
  note.textContent = summarise(run.field, ev);
  out.append(note);

  if (!ev.found) {
    out.append(el('div', 'note', 'It found no signals it could name in that. Say more about what is at stake — what it costs, who it affects, what happens if it goes wrong — and the ranking will change.'));
  }

  out.append(el('h3', null, 'ways you could go'));
  const held_ = run.field.holds || [];
  const roads = run.field.roads || [];
  held_.forEach((h, i) => out.append(stanceCard(h, i === 0 ? 'top' : 'held', ev)));
  if (roads.length) {
    out.append(el('h3', null, 'set aside — and why that matters'));
    out.append(el('div', 'note', 'These did not clear the bar on your own words. They are kept, not deleted: the road you nearly took is the thing you want back when the first one fails.'));
    for (const r of roads) out.append(stanceCard(r, 'road', ev));
  }

  // The field is already complete and useful. A model, if you have one, only says it better — so it
  // is offered as a second step rather than blocking the first.
  const canPhrase = reach(me).t2;
  if (canPhrase && held_.length) {
    const rowP = el('div', 'row');
    const better = el('button', 'act', 'put this in my own terms'); better.type = 'button';
    const cost = el('span', 'quiet');
    const paid = route(asked, me, { mind: 2 });
    cost.textContent = paid.yours ? 'free — runs on your machine' : `this one costs money · ${paid.name}`;
    rowP.append(better, cost);
    out.append(rowP);
    better.addEventListener('click', async () => {
      better.disabled = true; better.textContent = 'asking…';

      // ⚑ phrase() takes ONE prompt and NEVER throws — it catches the failure and reports it in
      // `note`. So there is nothing to wrap: fall-os is already being honest about what happened,
      // and the job here is to repeat it rather than invent a friendlier version.
      const r = await phrase(asked, held_, ev, (prompt) => askModel(paid.provider, SYSTEM, prompt));

      // Only rows the model actually rewrote get a new line. Anything it echoed back keeps the
      // built-in wording, because an echo is the characteristic failure that most looks like success.
      const cards = [...out.querySelectorAll('.stance.top, .stance.held')];
      r.rows.forEach((row, i) => {
        if (!row.phrased || !cards[i]) return;
        const line = el('div', 'm');
        line.style.color = 'var(--ink)';
        line.textContent = row.phrased;
        cards[i].append(line);
      });

      if (r.failed) {
        better.disabled = false; better.textContent = 'try again';
        // Nothing was charged for a call that never landed, and nothing was sent anywhere else.
        say(r.note);
        return;
      }

      me.ran.push({ rung: paid.rung, mind: 2, cost: paid.cost }); save(); drawTop();
      better.textContent = 'done';
      say(`${r.note}. Nothing it wrote changed a single score — every one of those was fixed before it was asked.`);
    });
  }

  drawTop();
  where.innerHTML = decision.refused
    ? `<b class="r">${decision.refused}</b>`
    : decision.yours ? 'ran on <b>your machine</b> · free'
    : `ran on <b class="r">${decision.name}</b>`;
  say(`${held_.length} ways kept, ${roads.length} set aside — nothing is decided until you pick one.`);
}

function stanceCard(branch, kind, ev) {
  const v = branch.value || branch;
  const d = el('div', 'stance ' + kind);
  const h = el('div', 'h');
  h.append(el('span', 'n', v.label || v.stance || 'a way to go'));
  h.append(el('span', 'sc', typeof branch.score === 'number' ? branch.score.toFixed(2) : ''));
  d.append(h);
  if (v.move) d.append(el('div', 'm', v.move));

  // ⚑ SHOW THE WORDS, NOT THE CODE. The organ reports which SIGNALS moved a stance, by id — and an
  // id on the screen reads as "unknown", which is worse than saying nothing. The whole promise of
  // the tier-0 conductor is that every score traces back to a word you actually typed, so the words
  // are what goes on the card.
  const found = new Map(((ev && ev.signals) || []).map(sg => [sg.id, sg]));
  const said = (ids) => (ids || [])
    .map(id => found.get(id))
    .filter(Boolean)
    .map(sg => `${sg.label} (${sg.cues.join(', ')})`);
  const up = said(v.up), down = said(v.down);
  if (up.length) d.append(el('div', 'cue', 'counts for it: ' + up.join(' · ')));
  if (down.length) d.append(el('div', 'cue', 'counts against it: ' + down.join(' · ')));
  if (!up.length && !down.length) {
    d.append(el('div', 'cue', 'nothing in your words moved this either way — it is here on its default standing'));
  }

  if (kind !== 'road') {
    const b = el('button', 'pick', 'take this one'); b.type = 'button';
    b.addEventListener('click', () => {
      say(`You took "${v.label || v.stance}". Nothing was decided for you — that was yours.`);
      d.classList.add('top');
      b.disabled = true; b.textContent = 'taken';
    });
    d.append(b);
  }
  return d;
}

function draw() {
  drawTop(); drawNav();
  const p = $('#panel'); p.replaceChildren();
  p.append((P[at] || P.didy)());
  document.querySelector('main').scrollTop = 0;
}

addEventListener('keydown', (e) => {
  if (e.target.matches('input,textarea')) return;
  const hit = PANELS.find(x => x.key.toLowerCase() === e.key.toLowerCase());
  if (hit) { at = hit.id; draw(); }
});

let prompt_ = null;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); prompt_ = e; $('#install').hidden = false; });
$('#install').hidden = true;
$('#install').addEventListener('click', async () => {
  if (!prompt_) { say('Use your browser\'s own "install app" menu item.'); return; }
  prompt_.prompt(); const r = await prompt_.userChoice;
  say(r.outcome === 'accepted' ? 'Installed. It runs offline now.' : 'Not installed.');
  prompt_ = null;
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

draw();
say(`${SHOP.listed.length} things listed · ${SHOP.refused.length} refused for want of evidence · works with no key at all`);
</script>
