<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FALL WORLD</title>
<meta name="description" content="Install it like a game. Learn to use AI by using it — start on a key you already have, end up running on your own machine.">
<meta name="theme-color" content="#0a0c10">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --void:#0a0c10; --deck:#12161d; --sunk:#0d1016; --edge:#232a35; --soft:#181d26;
  --ink:#e2e8f0; --mid:#8d99a8; --faint:#5b6675;
  --gold:#dcb264; --gold-deep:#7d6224;
  --mine:#54d199; --rent:#e08a45; --stop:#dd6055; --cool:#5fa8e8;
  /* the estate's own grades, coloured the way a loot game colours them */
  --r-normal:#c8cdd6; --r-magic:#6f9df0; --r-rare:#e2cf62; --r-set:#4fd18f; --r-unique:#d0a05f;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Cascadia Mono',monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--sans);font-size:14.5px;
  line-height:1.55;display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h2{margin:0 0 4px;font-size:20px;font-weight:650;letter-spacing:-.01em}
h3{margin:16px 0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}
p.lead{margin:0 0 16px;color:var(--mid);max-width:70ch}
a{color:var(--cool)}

#top{display:grid;grid-template-columns:auto minmax(120px,1fr) auto;gap:8px 16px;align-items:center;
  padding:8px 14px;background:var(--deck);border-bottom:1px solid var(--edge);flex:0 0 auto;
  padding-top:max(8px,env(safe-area-inset-top))}
.crest{display:flex;align-items:baseline;gap:9px;min-width:0}
.crest .t{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.2em}
.crest .t b{color:var(--gold)}
.rank{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--gold-deep);color:var(--gold);border-radius:2px;padding:2px 7px;white-space:nowrap}
.xp .lab{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.xp .lab b{color:var(--mine);font-variant-numeric:tabular-nums}
.xp .lab b.r{color:var(--rent)}
.track{height:10px;background:var(--sunk);border:1px solid var(--edge);border-radius:2px;display:flex;overflow:hidden}
.track i{background:var(--mine);transition:width .35s}
.track u{background:repeating-linear-gradient(45deg,var(--rent),var(--rent) 4px,transparent 4px,transparent 8px);transition:width .35s}
#topRight{display:flex;gap:8px;align-items:center}
#topRight button{background:none;border:1px solid var(--edge);color:var(--mid);border-radius:3px;padding:3px 9px;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
#topRight button:hover{border-color:var(--gold);color:var(--gold)}
@media (max-width:720px){ #top{grid-template-columns:1fr auto} .xp{grid-column:1/-1} }

/* the guide: one voice, one line, always skippable */
#npc{background:linear-gradient(180deg,var(--deck),var(--sunk));border-bottom:1px solid var(--edge);
  padding:12px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;flex:0 0 auto}
#npc.gone{display:none}
#npc .face{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold-deep);display:grid;place-items:center;
  font-size:15px;background:var(--void);flex:0 0 auto}
#npc .said{min-width:0}
#npc .said .l{font-size:15px;line-height:1.5}
#npc .said .a{font-size:12.5px;color:var(--faint);margin-top:4px}
#npc .said .n{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-top:6px}
#npc .x{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
#npc .x button{background:none;border:1px solid var(--edge);color:var(--faint);border-radius:3px;padding:2px 8px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
#npc .x button:hover{border-color:var(--gold);color:var(--gold)}
#npc .x .step{font-family:var(--mono);font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.unlocked{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);z-index:20;
  background:var(--deck);border:1px solid var(--gold);border-radius:5px;padding:9px 16px;
  display:flex;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.5);
  animation:rise .35s ease}
.unlocked .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.lockedNote{border:1px dashed var(--edge);border-radius:5px;padding:14px 16px;color:var(--faint);font-size:13.5px}

#body{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr)}
nav{background:var(--deck);border-right:1px solid var(--edge);display:flex;flex-direction:column;padding:8px 6px;gap:3px;overflow-y:auto}
nav button{display:flex;align-items:center;gap:9px;background:none;border:1px solid transparent;border-radius:4px;
  padding:7px 10px;cursor:pointer;color:var(--mid);white-space:nowrap;text-align:left}
nav button:hover{background:var(--sunk);color:var(--ink)}
nav button.on{background:var(--sunk);border-color:var(--gold-deep);color:var(--gold)}
nav .ic{font-size:15px;width:18px;text-align:center;flex:0 0 auto}
nav .k{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--faint);border:1px solid var(--edge);border-radius:2px;padding:0 4px}
@media (max-width:760px){
  #body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  nav{flex-direction:row;border-right:none;border-bottom:1px solid var(--edge);overflow-x:auto;padding:6px}
  nav .lb,nav .k{display:none} nav button{padding:8px 12px} nav .ic{font-size:17px}
}
main{overflow-y:auto;padding:18px 20px 44px;min-width:0}
.panel{max-width:1000px}

.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.card{border:1px solid var(--edge);border-left-width:3px;border-radius:5px;background:var(--deck);padding:11px 13px;display:grid;gap:5px}
.card.proven{border-left-color:var(--mine)} .card.works{border-left-color:var(--cool)} .card.prototype{border-left-color:var(--faint)}
.card .r1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .nm{font-weight:650}
.card.n-normal .nm{color:var(--r-normal)} .card.n-magic .nm{color:var(--r-magic)}
.card.n-rare .nm{color:var(--r-rare)} .card.n-set .nm{color:var(--r-set)} .card.n-unique .nm{color:var(--r-unique)}
.card.n-magic{border-left-color:var(--r-magic)} .card.n-rare{border-left-color:var(--r-rare)}
.card.n-set{border-left-color:var(--r-set)} .card.n-unique{border-left-color:var(--r-unique)}
.rar{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.rar.n-normal{color:var(--r-normal)} .rar.n-magic{color:var(--r-magic)} .rar.n-rare{color:var(--r-rare)}
.rar.n-set{color:var(--r-set)} .rar.n-unique{color:var(--r-unique)}
.tool.n-magic{border-left-color:var(--r-magic)} .tool.n-rare{border-left-color:var(--r-rare)}
.tool.n-set{border-left-color:var(--r-set)} .tool.n-unique{border-left-color:var(--r-unique)}
.slot .fn{color:var(--ink)}
.card .d{font-size:12.5px;color:var(--mid)}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--edge);
  border-radius:99px;padding:1px 7px;color:var(--faint);white-space:nowrap}
.tag.proven{border-color:var(--mine);color:var(--mine)}
.tag.works{border-color:var(--cool);color:var(--cool)}
.tag.price{border-color:var(--gold-deep);color:var(--gold)}
.tag.on{border-color:var(--mine);color:var(--mine)}
.ev{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.reach{display:flex;flex-wrap:wrap;gap:4px}
.rc{font-family:var(--mono);font-size:9.5px;border-radius:2px;padding:1px 6px;border:1px solid var(--edge);color:var(--mid)}
.rc.no{color:var(--faint);opacity:.5;text-decoration:line-through}
.act{background:none;border:1px solid var(--gold-deep);color:var(--gold);border-radius:4px;padding:5px 11px;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;justify-self:start}
.act:hover{background:var(--sunk)}

.warn{border:1px solid var(--stop);color:var(--stop);border-radius:5px;padding:11px 13px;margin-bottom:12px;font-size:13.5px}
.note{border:1px solid var(--edge);border-radius:5px;padding:11px 13px;margin-bottom:12px;font-size:13.5px;color:var(--mid)}
.note b,.warn b{color:var(--ink)} .warn b{color:var(--stop)}
.good{border-color:var(--mine);color:var(--mine)} .good b{color:var(--mine)}
.quiet{color:var(--faint);font-style:italic;font-size:13px}


/* ── the opening: what this is, said once, to somebody who has never seen it ─────────── */
.opening{border:1px solid var(--edge);border-radius:8px;background:var(--deck);padding:18px 20px;margin-bottom:16px}
.opening h2{font-size:23px;margin:0 0 10px}
.opening p{margin:0 0 10px;color:var(--mid);max-width:66ch;font-size:15px}
.opening p b{color:var(--ink);font-weight:650}
.opening .three{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:14px}
.opening .one{border-left:2px solid var(--gold-deep);padding-left:11px}
.opening .one .t{font-weight:650;font-size:14px;margin-bottom:2px}
.opening .one .d{font-size:13px;color:var(--faint);line-height:1.45}
/* the didy */
#ask{width:100%;min-height:90px;background:var(--sunk);border:1px solid var(--edge);border-radius:5px;
  padding:11px 13px;font-size:15px;resize:vertical}
.row{display:flex;gap:9px;align-items:center;margin-top:10px;flex-wrap:wrap}
.go{background:var(--gold);color:var(--void);border:none;border-radius:5px;padding:9px 18px;font-weight:700;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.go:disabled{background:var(--sunk);color:var(--faint);border:1px solid var(--edge);cursor:default}
.where{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}
.where b{color:var(--mine)} .where b.r{color:var(--rent)}
.stance{border:1px solid var(--edge);border-left-width:3px;border-radius:5px;background:var(--deck);padding:11px 13px;margin-bottom:8px}
.stance.top{border-left-color:var(--gold)}
.stance.held{border-left-color:var(--mine)}
.stance.road{border-left-color:var(--faint);opacity:.72}
.stance .h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.stance .n{font-weight:650}
.stance .sc{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.stance .m{font-size:13px;color:var(--mid);margin-top:3px}
.stance .cue{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:4px}
.pick{background:none;border:1px solid var(--gold-deep);color:var(--gold);border-radius:4px;padding:4px 10px;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:7px}

/* keys */
.field{display:grid;gap:6px;margin-bottom:14px;max-width:620px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.field input{background:var(--sunk);border:1px solid var(--edge);border-radius:4px;padding:9px 11px;font-family:var(--mono);font-size:12.5px}
.field .h{font-size:12.5px;color:var(--faint)}
.rungs{display:grid;gap:8px;max-width:640px}
.rung{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;border:1px solid var(--soft);
  border-radius:5px;background:var(--sunk);padding:10px 12px}
.rung.have{border-color:var(--mine)}
.rung .p{width:9px;height:9px;transform:rotate(45deg);background:var(--edge)}
.rung.have .p{background:var(--mine)}
.rung .t{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase}
.rung.have .t{color:var(--mine)}
.rung .s{font-size:12.5px;color:var(--mid)}
.rung .st{font-family:var(--mono);font-size:10px;color:var(--faint);white-space:nowrap}

.zones{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(225px,1fr))}
.zone{display:block;text-decoration:none;color:inherit;border:1px solid var(--edge);border-radius:5px;background:var(--deck);padding:10px 12px}
.zone:hover{border-color:var(--gold)}
.zone .n{font-weight:650;display:block} .zone .s{font-size:12.5px;color:var(--mid);display:block;margin-top:2px}
.zone .first{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.wing{margin-bottom:22px} .wing .wh{display:flex;align-items:baseline;gap:9px;margin-bottom:6px}
.wing .ic{font-size:17px} .wing .wb{font-size:13px;color:var(--mid);margin:0 0 9px}


/* ── the cockpit: talk on the left, your didy and its kit on the right ───── */
.cockpit{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,330px);gap:14px;align-items:start}
@media (max-width:900px){ .cockpit{grid-template-columns:1fr} }
.rig{border:1px solid var(--edge);border-radius:8px;background:var(--deck);padding:14px;position:sticky;top:0}
.rig .who{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);text-align:center}
.rig .ring{width:74px;height:74px;margin:10px auto;border-radius:50%;border:2px solid var(--gold-deep);
  display:grid;place-items:center;font-size:28px;background:var(--void);transition:box-shadow .3s,border-color .3s}
.rig.powered .ring{border-color:var(--mine);box-shadow:0 0 20px color-mix(in srgb,var(--mine) 35%,transparent)}
.rig .can{font-size:12.5px;color:var(--mid);text-align:center;line-height:1.45}
.rig .can b{color:var(--mine)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}
.slot{border:1px dashed var(--edge);border-radius:6px;min-height:58px;display:grid;place-items:center;padding:7px;
  text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  transition:border-color .15s,background .15s}
.slot.over{border-color:var(--gold);border-style:solid;background:color-mix(in srgb,var(--gold) 12%,transparent)}
.slot.filled{border-style:solid;border-color:var(--mine);background:var(--sunk)}
.slot .fn{font-family:var(--sans);font-size:12.5px;font-weight:650;letter-spacing:0;text-transform:none;color:var(--mine)}
.slot .pull{background:none;border:none;color:var(--faint);cursor:pointer;font-size:9.5px;text-decoration:underline;margin-top:2px}
.stats{display:grid;gap:5px;border-top:1px solid var(--edge-soft);padding-top:10px;margin-top:4px}
.stat{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.stat b.m{color:var(--mine)} .stat b.r{color:var(--rent)}
.tools{display:grid;gap:6px;margin-top:10px;border-top:1px solid var(--edge-soft);padding-top:10px}
.tool{border:1px solid var(--edge);border-left-width:3px;border-radius:5px;background:var(--sunk);padding:7px 9px;cursor:grab;user-select:none}
.tool:active{cursor:grabbing}
.tool.dragging{opacity:.45}
.tool.proven{border-left-color:var(--mine)} .tool.works{border-left-color:var(--cool)} .tool.prototype{border-left-color:var(--faint)}
.tool .tn{font-weight:650;font-size:12.5px}
.tool .grab{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
#log{border-top:1px solid var(--edge);background:var(--deck);flex:0 0 auto;display:flex;gap:9px;align-items:center;
  padding:8px 14px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#log .by{font-family:var(--mono);font-size:10px;color:var(--faint);white-space:nowrap;letter-spacing:.06em}
#log .by b{color:var(--gold)}
#log .line{flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.cardgate { border: 1.5px dashed rgba(212,160,23,0.45); border-radius: 8px; padding: 12px 14px; margin: 10px 0 14px; cursor: pointer; transition: border-color .15s, background .15s; }
.cardgate:hover, .cardgate.over { border-color: var(--gold, #d4a017); background: rgba(212,160,23,0.07); }
.cardgate .t { font-size: .92em; opacity: .92; }
</style>
</head>
<body>

<div id="top">
  <div class="crest"><span class="t">FALL<b>·</b>WORLD</span><span class="rank" id="rank">renting</span></div>

    <div class="lab"><span>ran on your own machine</span><span id="split">nothing yet</span></div>
    <div class="track" id="track"><i style="width:0"></i><u style="width:0"></u></div>
  </div>
  <div id="topRight"><button type="button" id="install">install</button></div>
</div>

<div id="npc"></div>

<div id="body">

  <main><div class="panel" id="panel"></div></main>
</div>

<div id="log">
  <span class="line" id="logline">loading…</span>
  <span class="by">powered by <b>fall&middot;os</b> &middot; Konomi Architecture</span>
  <a class="by" id="who" href="https://www.ai-nativesolutions.com/" target="_blank" rel="noopener"></a>
</div>

<script type="module">
// ── reading things that might not be there ──
const { text, num, nonneg, list, field, reader, isThing, oneOf } = (() => {
// ══════════════════════════════════════════════════════════════════════════════════════════════
// safe.mjs — reading things that might not be there, in one place.
//
// Every kernel in this repo has to survive a half-written save, a feed written by somebody else, or
// an object whose getter throws. That produced the same four helpers copy-pasted into six files —
// which the structural assessor caught as repeated blocks, correctly. Six copies of a guard is six
// places for it to drift, and the day one of them loses its try/catch nobody finds out until a
// screen goes blank.
//
// ⚑ THE POINT OF ALL OF THESE IS THE SAME: reading a value must never be the thing that fails. A
// getter can throw. A toString can throw. A number can be NaN. None of that is exotic — it is what
// arrives when the input came from a file, a URL, another program, or an older version of this one.
// ══════════════════════════════════════════════════════════════════════════════════════════════

/** Anything to text, including things that refuse to become text. */
const text = (v) => { try { return String(v ?? ''); } catch { return ''; } };

/** A finite number or the fallback. NaN and Infinity are not numbers you can act on. */
const num = (v, d = 0) => (Number.isFinite(v) ? v : d);

/** A finite number that is not negative, or the fallback. */
const nonneg = (v, d = 0) => (Number.isFinite(v) && v >= 0 ? v : d);

/** An array of text, from anything. Never throws, never returns a non-array. */
const list = (v) => (Array.isArray(v) ? v.map(text).filter(Boolean) : []);

/** Read one field off anything at all — including an object whose getter throws. */
const field = (o, k) => { try { return o[k]; } catch { return undefined; } };

/** A reader bound to one object, for the common case of pulling several fields off it. */
const reader = (o) => (k) => field(o, k);

/** True only for a real object — not null, not an array, not a string. */
const isThing = (v) => Boolean(v) && typeof v === 'object' && !Array.isArray(v);

/** One of the allowed values, or the first as a default. Refuses unknown names rather than passing them. */
const oneOf = (v, allowed, d) => (allowed.includes(v) ? v : (d !== undefined ? d : allowed[0]));

return { text, num, nonneg, list, field, reader, isThing, oneOf };
})();

// ── fall-os · core ──
const { PHI, KAPPA, GOLDEN_DEG, h16, fork, hold, collapse, makeCache, move, organ } = (() => {
// core.mjs — LIVEWARE · THE ONE MOVE, as shared DNA.
//
// Every organ built this window is the SAME operation aimed at a different target:
//   hold possibility open  →  fork on the golden offset (so branches diverge, not cluster)
//   →  resolve at the κ-gate (≥κ holds, <κ clashes)  →  collapse DELIBERATELY (never auto)
//   →  cache by content (run(S)==S, build once).
// The Oracle (future), re-collapse (past) and the generative estate (build-space) are this

const clamp01 = (x) => (Number.isFinite(x) ? Math.min(1, Math.max(0, x)) : 0);

/**
 * Score one stance against found signals. Traceable by construction: the returned `why` lists exactly
 * which signals pushed it up and which pushed it down, so the number can be checked against the text.
 */
function scoreStance(stance, ids) {
  const present = new Set(ids);
  const wantHit = (stance.wants || []).filter(w => present.has(w));
  const avoidHit = (stance.avoids || []).filter(a => present.has(a));
  const wantFrac = stance.wants && stance.wants.length ? wantHit.length / stance.wants.length : 0;
  const avoidFrac = stance.avoids && stance.avoids.length ? avoidHit.length / stance.avoids.length : 0;
  const score = clamp01(stance.prior + 0.45 * wantFrac - 0.30 * avoidFrac);
  return { score, up: wantHit, down: avoidHit };
}

 * The organ, in the shape `conduct()` expects: `{ phase, generate, score }`.
 *
 * `generate(i, theta)` is called by the core's `fork`, which walks i = 0,1,2… and hands back the
 * golden angle. The stance is picked by STEPPING THROUGH THE TAXONOMY AT THE GOLDEN OFFSET rather
 * than in list order — so a visitor asking for 4 branches gets four spread across the taxonomy
 * instead of the first four in the file, which is the whole point of forking on 137.5°. Modulo the
 * list length it is a bijection for any n ≤ the taxonomy size, so nothing is visited twice.
 */

    phase: 'explore',
    evidence: ev,

      // organ safe to run more than once — without it the "already handed out" set survives into the
      // next fork and the SAME organ answers the SAME question with a different field. That is not a
      // cosmetic bug: the conductor re-runs the loop when the visitor authors a branch, so committing
      // "verify before you commit" would quietly build something they never saw.
      if (i === 0) seen.clear();
      // Walk the taxonomy by the golden step, skipping any stance already handed out. The skip loop
      // is what keeps it a permutation when n approaches the taxonomy size.
      let idx = Math.round((theta / 360) * STANCES.length) % STANCES.length;
      let guard = 0;
      while (seen.has(idx) && guard < STANCES.length) { idx = (idx + 1) % STANCES.length; guard++; }

      const st = STANCES[idx];

  };
}

 * — when the text carried no signal at all — says that in place of implying the scores meant more
 * than the stated priors.

// t1.mjs — TIER 1 · a real model, running in the visitor's own tab.
//
// Tier 0 gives a scored field of stances but cannot read a sentence. Tier 1 adds a small language
// model — downloaded once, then run entirely in the browser on WebGPU — whose ONLY job is to say
// each held stance in the terms of THIS decision. It phrases; it does not decide.
//
// ⚑ THE LOAD-BEARING CONSTRAINT. The page tells visitors: "the field, the gate and the shadow are
// this same code either way." That has to be structurally true, not a promise. So this module never
// returns a field — it returns PHRASINGS keyed to branches whose score, order, label and index are
// copied from the tier-0 result. A model that hallucinates a score, invents a stance, reorders the
// list or tries to award itself the win cannot move anything, because nothing it emits is ever read
// as a number. The test suite attacks exactly that, with adversarial replies.
//
// The model call itself is INJECTED — `phrase(field, decision, generate)` takes an async
// `generate(prompt) -> string`. Same seam the core uses for generate/score: the kernel stays pure,
// deterministic and gateable, and WebLLM is wired to it in door.mjs. It can therefore be proven
// without downloading a gigabyte, and the proof is about the logic rather than about one model's
// mood on the day.

const SYSTEM =
  'You rewrite decision-making advice so it speaks to one specific situation. ' +
  'You never choose between options, never rank them, never add options, and never mention scores. ' +
  'You only restate the given approach in the words of the situation you are shown.';

const clean = (s) => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();

/**
 * The prompt. Numbered so the reply can be mapped back by position rather than by matching text —
 * matching on the stance NAME would let a model rename a stance and have its line silently applied
 * to a different one.
 *
 * The evidence is included because it is what makes the phrasing specific: the model is told which
 * cue words were found, so it grounds its sentence in the visitor's own wording rather than
 * inventing circumstances that were never mentioned.
 */
function buildPrompt(decision, holds, evidence) {
  const dec = clean(decision) || '(no decision given)';
  const list = (holds || []).map((h, n) =>
    `${n + 1}. ${clean(h.value && h.value.label)} — ${clean(h.value && h.value.move)}`).join('\n');

    ? evidence.signals.map(s => `${s.label} (${s.cues.join(', ')})`).join('; ')
    : 'none detected';

    `THE DECISION: ${dec}`,
    ``,
    `SIGNALS FOUND IN IT: ${signals}`,
    ``,
    `APPROACHES TO RESTATE:`,
    list,
    ``,
    `Rewrite each numbered approach as ONE short sentence naming what to actually do about THIS`,
    `decision. Keep the same numbers and the same order. Do not add, drop, rank or compare them.`,
    // Spelled out because repeating the input back is the characteristic small-model failure, and it
    // is the one that superficially looks like a correct answer. The kernel refuses echoes anyway;
    // saying it here means fewer of them to refuse.
    `Do NOT repeat the approach's name or reuse its wording — write a new sentence that mentions the`,
    `specifics of the situation above.`,

/**
 * Read the reply back. Returns `byIndex` (1-based position → sentence) plus `ignored`, every line
 * that did not parse, kept and reported.
 *
 * NOTHING IS SILENTLY DROPPED — the estate's rule, and it matters more here than usual: a small
 * model preambles, bullets, repeats itself and stops early, and a parser that quietly discards the
 * mess would report confident phrasings for some stances and leave others bare with no explanation.
 */
function parseReply(text, count) {
  const n = Math.max(0, Math.floor(count || 0));
  const byIndex = new Map();
  const ignored = [];

    // Small models bullet and bold their lists — `- **1.** do the thing` is a normal reply, not a
    // malformed one. Strip the decoration before looking for the number, or every phrasing from a
    // model that likes markdown is thrown away as unparseable.
    const line = raw.trim().replace(/^[-*•\s]+/, '').replace(/\*\*/g, '').trim();
    if (!line) continue;
    const m = line.match(/^(\d{1,2})\s*[).:\]-]\s*(.+)$/);
    if (!m) { ignored.push(line.slice(0, 120)); continue; }
    const idx = Number(m[1]);
    const body = clean(m[2]).replace(/^\*+|\*+$/g, '').trim();
    // Out of range, or a repeat of a number already answered: kept and reported, never applied.
    if (idx < 1 || idx > n || byIndex.has(idx) || !body) { ignored.push(line.slice(0, 120)); continue; }
    byIndex.set(idx, body);
  }
  return { byIndex, ignored, parsed: byIndex.size, expected: n };
}

const norm = (s) => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();

/**
 * Reject a "phrasing" that is just the built-in wording handed back.
 *
 * ⚑ FOUND BY RUNNING A REAL MODEL. A 360M model asked to rewrite `Verify before you commit — Decide
 * what would prove this wrong` replies `Verify before you commit — Decide what would prove this
 * wrong.` Every check upstream passes: it is a valid numbered line for a real stance. But showing it
 * under a heading that says "in your words" tells the visitor a model did something for them when it
 * did nothing, which is the precise flavour of theatre this estate exists to delete.
 *
 * Returns the usable remainder, or null when there is nothing but an echo. The stance NAME is
 * stripped first, because prefixing the title is the small-model habit rather than the failure —
 * what follows it may still be genuinely new.
 */
function deEcho(text, label, move) {
  let body = clean(text);
  if (!body) return null;
  const nLabel = norm(label);
  // "Verify before you commit — <rest>" / "Verify before you commit: <rest>"
  if (nLabel && norm(body).startsWith(nLabel)) {
    // If the pattern does not match, `replace` hands back the same string and the assignment is a
    // no-op — so the only thing worth checking is that stripping left something behind. (An extra
    // "and it actually changed" clause lived here until the mutation gate showed nothing could
    // distinguish it: it was unreachable logic dressed as a safety check.)
    const cut = clean(body.replace(/^[^—:\-]*[—:\-]\s*/, ''));
    if (cut) body = cut;
  }

  if (!nBody) return null;
  if (nBody === nMove || nBody === nLabel) return null;
  // A model that pads the built-in sentence with a couple of words has still not said anything of
  // its own; require that the reply is not simply the move with decoration around it.
  if (nMove && nBody.includes(nMove)) return null;
  return body;
}

/**
 * Attach the model's sentences to the tier-0 branches.
 *
 * Every returned row carries the branch's OWN index, score and label, copied across. `phrased` is
 * the only field the model contributes, and it is absent — not guessed — when the model did not
 * produce a usable line for that row.
 */
function attach(holds, parsed) {
  const list = holds || [];
  return list.map((h, n) => {
    const label = h.value && h.value.label, move = h.value && h.value.move;
    const raw = parsed.byIndex.get(n + 1) || null;
    return {
      i: h.i,
      score: h.score,
      label,
      move,
      phrased: raw ? deEcho(raw, label, move) : null,
      echoed: !!raw && deEcho(raw, label, move) === null,
    };

/**
 * The whole tier: prompt → model → attached phrasings, with a report of what the model actually
 * managed. `generate` is injected and may throw or return junk; either way the caller still gets a
 * complete set of rows, because the deterministic text is what is really being shown.
 */
async function phrase(decision, holds, evidence, generate) {

    reply = typeof generate === 'function' ? await generate(prompt) : '';
  } catch (e) {

  const rows = attach(list, parsed);
  const got = rows.filter(r => r.phrased).length;
  const echoed = rows.filter(r => r.echoed).length;

    rows, prompt, reply, failed,
    covered: got,
    echoed,
    expected: list.length,
    ignored: parsed.ignored,
    // Said plainly so the UI can say it plainly. A tier that quietly half-worked is worse than one
    // that admits it did: the visitor is being asked to trust the deterministic layer underneath.
    // "Echoed" gets its own sentence because it is the characteristic failure of the small models
    // this tier exists to run, and it is the one that most looks like success.
    note: failed ? `the model failed (${failed}) — showing the built-in wording`
      : got === 0 && echoed > 0 ? `the model only repeated the built-in wording back (${echoed} of ${list.length}) — a bigger model rewrites these properly`
        : got === 0 ? 'the model returned nothing usable — showing the built-in wording'
          : got < list.length ? `the model phrased ${got} of ${list.length}${echoed ? `, echoed ${echoed}` : ''} — the rest keep the built-in wording`

}

/**
 * The guard, exported so it can be asserted rather than assumed: are these rows still the tier-0
 * field? Compares index, score and label pairwise. Used by the tests, and cheap enough that the UI
 * can run it before it renders anything the model touched.

  const a = holds || [], b = rows || [];

    if (a[n].score !== b[n].score) return false;

}


return { SYSTEM, buildPrompt, parseReply, deEcho, attach, phrase, unmoved };
})();

// ── the rungs ──
const { RUNGS, rungOf, DEFAULT_PURSE, KEY_MIN, reach, route, tally, wouldSave, readout } = (() => {
// ══════════════════════════════════════════════════════════════════════════════════════════════
// ladder.mjs — the rung above fall-os, and the rule for coming down it.
//
// fall-os already has the bottom two rungs and they are gated: t0 is the conductor with no model at
// all, t1 is a real model running in your own tab. What it does not have is the rung everybody
// actually starts on — somebody else's frontier model, reached with a key you pay for.
//
// That rung matters because of the direction of travel. A tool that demands you install a model
// before it does anything never gets past the download. So: paste a key, it works today, and every
// job tells you it cost money. Then you build, and the same jobs start staying home. The bill going
// DOWN as you get better is the whole product, and it is the one thing a subscription cannot copy.
//
// ⚑ THE ROUTING IS NOT REIMPLEMENTED HERE. Choosing between rungs is exactly what fall-os's walk.mjs
// already does — nodes with a worth and a price, a purse that may never go negative, the price paid
// on arrival. This file builds the nodes and hands them to `walk`. Writing a second router beside a
// gated one is how the copy becomes the version people read.
//
// ⚑ AND IT NEVER SILENTLY ESCALATES. Asking for your own machine and not getting it is an answer,
// not a reason to spend your money. Escalation is offered in words and taken by the caller.
//
// Pure and total: no clock, no I/O, no randomness.
// ══════════════════════════════════════════════════════════════════════════════════════════════

/** The rungs, bottom (cheapest to you) first. `holds` is the largest job the rung can carry. */
const RUNGS = Object.freeze([
  { id: 't0', name: 'no model', holds: 0, yours: true, price: 0,
    blurb: 'plain deterministic code on your machine — free forever, and it never guesses' },
  { id: 't1', name: 'your own model', holds: 1, yours: true, price: 0,
    blurb: 'a real model running in your tab or on your box — free after you build it' },
  { id: 't2', name: 'a frontier model', holds: 2, yours: false, price: 1,
    blurb: 'somebody else\'s big model, reached with a key you pay for — where everybody starts' },
]);

const rungOf = (id) => RUNGS.find(r => r.id === id) || null;

// What a run may spend before it has to ask. Finite on purpose — see the note in route().
const DEFAULT_PURSE = 20;

// Shorter than this is somebody testing the box, not a key. Both providers' keys are far longer.
const KEY_MIN = 9;


/**
 * What you can actually reach right now. Deliberately blunt: a model you own but have not started
 * holds nothing, and a key you have not pasted is not a key.
 */
function reach(state) {
  // Every field read through one shield: a getter that throws must not take the client down, and
  // the shield also makes a type-guard in front of it dead code — a number or a string just yields
  // undefined either way.
  const get = (k) => field(state, k);
  const keys = (() => {
    const k = get('keys');
    if (!k || typeof k !== 'object') return [];
    // A key is a key when it is a string somebody actually pasted. Nothing here is inferred.
    // Long enough to be a real key rather than a placeholder somebody typed to see what happened.
    return Object.keys(k).filter(p => typeof k[p] === 'string' && k[p].trim().length >= KEY_MIN).sort();
  })();

    t0: true,                                   // always: it is just code, and it is already here
    t1: get('localUp') === true,
    t2: keys.length > 0,
    keys: Object.freeze(keys),
  });
}

/**
 * Route one job of size `mind`. Built as a walk over the rungs: reaching a rung costs its price,
 * and its worth is how much of the job it can actually carry. walk() does the choosing.
 */
function route(job, state, opts) {
  const o = (opts && typeof opts === 'object') ? opts : {};
  const mind = [0, 1, 2].includes(o.mind) ? o.mind : 1;
  const insist = text(o.insist) || null;
  const have = reach(state);

  const usable = RUNGS.filter(r => have[r.id] && r.holds >= mind);
  const yoursOnly = insist === 'yours' || insist === 'local';

  if (!usable.length) {
    return {
      rung: null, yours: null, mind, cost: 0, provider: null,
      refused: have.t2
        ? `nothing available can carry a job this size (needs ${mind})`
        : have.t1
          ? `this needs more model than your own can carry (${mind} > 1), and there is no key to fall back on`
          : 'your own model is not running and no key has been added, so there is nowhere to run this',
      couldEscalate: false,
    };
  }

  const yours = usable.filter(r => r.yours);
  if (yoursOnly && !yours.length) {

    // money to keep the screen moving is the silent bill this whole ladder exists to make visible.
    return {
      rung: null, yours: null, mind, cost: 0, provider: null,
      refused: have.t1
        ? `you asked for this to stay on your machine, and it needs more model than yours carries (${mind} > 1)`
        : 'you asked for this to stay on your machine, and your own model is not running',
      couldEscalate: usable.some(r => !r.yours),
    };
  }

  const pool = yoursOnly ? yours : usable;

  // Hand the choice to fall-os. Its graph is { edges, nodes }: edges name where you can go from a
  // node, nodes carry the worth and the price. Worth is how much of the job a rung can carry; price
  // is what it costs you. walk's own rule — pay on arrival, never dip below nothing — does the rest.
  const graph = {
    edges: { here: pool.map(r => r.id), ...Object.fromEntries(pool.map(r => [r.id, []])) },
    // ⚑ WORTH FALLS AS THE RUNG GETS BIGGER. The pool is already only rungs that CAN carry this
    // job, so the best one is the SMALLEST of them — using a language model for something plain
    // deterministic code does perfectly is the exact waste this ladder exists to remove, and it is
    // waste even when the model is free. Scoring by capability instead sent every trivial job to
    // the largest thing available, which is how "it's local so it's fine" quietly becomes a habit.
    nodes: {
      here: node('here', 0, 0),
      ...Object.fromEntries(pool.map(r => [r.id, node(r.id, RUNGS.length - r.holds, r.price)])),
    },
  };

  // "unlimited" is not a budget, it is the absence of one, and a router handed Infinity would
  // cheerfully route everything to the most expensive rung forever. Passing Infinity here made
  // every single route unaffordable, including the free one, which is the strictness working.
  const seen = walk(graph, 'here', { purse: num(o.purse, DEFAULT_PURSE), depth: 1 });
  const chosen = seen.best && seen.best.path.length ? seen.best.path[seen.best.path.length - 1] : null;
  const picked = pool.find(r => r.id === chosen) || null;

  if (!picked) {
    return {
      rung: null, yours: null, mind, cost: 0, provider: null,
      // walk says exactly why, and repeating it beats inventing a friendlier sentence that is vaguer.
      // walk always says exactly why, and repeating it beats a friendlier sentence that is vaguer.
      refused: seen.finding,
      couldEscalate: false,
    };
  }

  return {
    rung: picked.id,
    name: picked.name,
    yours: picked.yours,
    mind,
    cost: picked.price,
    provider: picked.yours ? null : (have.keys[0] ?? null),
    why: picked.blurb,
    // Said on every single job, not once at setup. A cost you stop being shown is one you stop
    // noticing, and feeling it is the point of the ladder.
    note: picked.yours ? null
      : have.t1 ? 'your own model is running but cannot carry a job this size'
                : 'your own model is not running, so this went out to a paid one',
  };
}

/**
 * ⚑ WHAT ACTUALLY RAN WHERE. The only honest source for the number on the bar. A percentage
 * computed from what you have installed is a statement about intentions; this one you can check
 * against your card.
 */
function tally(entries) {
  const rows = (Array.isArray(entries) ? entries : [])
    .filter(e => e && typeof e === 'object' && rungOf(text(e.rung)));
  const mine = rows.filter(e => rungOf(e.rung).yours);
  const spent = rows.reduce((t, e) => t + num(e.cost, 0), 0);
  return {
    runs: rows.length,
    yours: mine.length,
    rented: rows.length - mine.length,
    spent,
    byRung: Object.fromEntries(RUNGS.map(r => [r.id, rows.filter(e => e.rung === r.id).length])),
    // ⚑ Nothing run is NO SCORE. An untouched client reading 100% sovereign would score best on the
    // day you had done nothing at all, which is the badge that cannot fail.
    sovereignty: rows.length === 0 ? null : mine.length / rows.length,
    verdict: rows.length === 0 ? 'Nothing has run yet, so there is nothing to be sovereign about.'
      : mine.length === rows.length ? `All ${rows.length} ran on your own machine.`
      : `${mine.length} of ${rows.length} on your machine · ${rows.length - mine.length} rented · ${spent} spent.`,

/** What the next rung would ACTUALLY have saved, read off what you really ran. Never a promise. */
function wouldSave(entries, rungId) {
  const r = rungOf(text(rungId));
  const rented = (Array.isArray(entries) ? entries : [])
    .filter(e => e && typeof e === 'object' && rungOf(text(e.rung)) && !rungOf(e.rung).yours);
  if (!r || !r.yours) return { runs: 0, spent: 0, say: 'That rung is not yours to build.' };
  const back = rented.filter(e => num(e.mind, 1) <= r.holds);
  return {
    runs: back.length,
    spent: back.reduce((t, e) => t + num(e.cost, 0), 0),
    say: back.length === 0
      ? 'Nothing you have run so far would have stayed home on that rung.'
      : `${back.length} of the ${rented.length} job(s) you paid for would have run on your own machine.`,
  };
}

/** The line under the chat box, so the cost is never out of sight. */
function readout(d) {
  const x = (d && typeof d === 'object') ? d : {};
  if (x.refused) return `refused — ${x.refused}`;
  if (!x.rung) return 'nowhere to run this';
  return x.yours ? `ran on your machine (${x.name}) · free`
                 : `ran on ${x.provider || 'a paid model'} · ${x.note || 'rented'}`;
}

return { RUNGS, rungOf, DEFAULT_PURSE, KEY_MIN, reach, route, tally, wouldSave, readout };
})();

// ── the store ──
const { TIER, RARITY, tierRank, TIER_MEANS, REACH, addon, listable, store, inspect, install, held, fromEstate } = (() => {
// ══════════════════════════════════════════════════════════════════════════════════════════════
// client.mjs — fallworld as a game you install, and the estate as addons you install into it.
//
// The client is free and runs on your machine. The tools are addons. An addon is not a link to
// somebody else's website; it is a thing that declares what it does, what it is allowed to touch,
// and how much model it needs — and the client holds it to all three.
//
// ⚑ NOTHING GETS LISTED ON SOMEBODY SAYING IT IS GOOD.
// Every store on earth has the same hole: the listings cannot be trusted. Stars get bought, reviews
// get written by the seller, "works great" means nothing. So a listing here carries a tier that was
// COMPUTED from what the thing's own CI actually ran — never set by whoever wrote it — and an addon
// with no evidence at all cannot be listed, at any price.
//
// ⚑ AND A PAID ADDON MUST BE PROVEN. Charging for something that cannot pass its own gate is the
// exact trade this whole estate exists to make impossible. It is enforced here, not promised.
//
// ⚑ THE ONE PEOPLE GET WRONG: PERMISSIONS ARE JUDGED TOGETHER, NEVER ONE AT A TIME.
// Every permission system fails the same way — each addon looks reasonable on its own screen, you
// approve them one by one over six months, and nobody ever sees the pile. One addon that reads your
// memory is fine. One that writes to a repo is fine. One that reaches the network is fine. All three
// installed is a thing that can read your memory and post it somewhere, and no single approval
// screen ever showed you that. So the client computes the COMBINED grant of everything installed,
// and names the reaches that only exist because of the combination.
//
// Pure and total. No clock, no I/O, no randomness.
// ══════════════════════════════════════════════════════════════════════════════════════════════

/** What a thing has actually been shown to do. Computed from its CI, never declared. */
const TIER = Object.freeze({ prototype: 'prototype', works: 'works', proven: 'proven' });

/** How rare a thing is, in the estate's own grading. Two different questions, deliberately kept
 *  apart: rarity is what KIND of thing it is; the tier is whether it has been shown to work. A
 *  legendary that nobody has ever checked is still a legendary nobody has ever checked. */
const RARITY = Object.freeze(['normal', 'magic', 'rare', 'set', 'unique']);
const LADDER = [TIER.prototype, TIER.works, TIER.proven];
const tierRank = (t) => LADDER.indexOf(String(t));

const TIER_MEANS = Object.freeze({
  prototype: 'nothing runs a check on it — it may be perfect, but nobody has shown that',
  works: 'something runs and passes, so it does what it says on a good day',
  proven: 'its own gate breaks it on purpose and the tests catch it',
});

/** What an addon may touch. Deliberately few and blunt: a permission nobody can read is one nobody can refuse. */
const REACH = Object.freeze({
  read: 'read your notes and memory',
  write: 'change files on your machine',
  net: 'reach the internet',
  spend: 'spend from your budget',
  publish: 'put things where other people can see them',
  run: 'run other programs',
});
const REACHES = Object.keys(REACH);

// Pairs that are quiet apart and loud together. This is the whole point of judging the pile.
const TOGETHER = Object.freeze([
  { needs: ['read', 'net'], say: 'read your private notes AND send them out — nothing installed alone could do that' },
  { needs: ['read', 'publish'], say: 'read your private notes AND publish them where others can see' },
  { needs: ['write', 'run'], say: 'write a program to your machine AND then run it' },
  { needs: ['net', 'run'], say: 'fetch something off the internet AND run it' },
  { needs: ['net', 'spend'], say: 'reach the internet AND spend your money' },
  { needs: ['write', 'publish'], say: 'change your files AND publish the result' },
]);


/**
 * Declare an addon. `tier` and `evidence` are not the author's opinion — they come from what the
 * thing's CI ran, which is why they are read here rather than argued about.
 */
function addon(spec) {
  // Read every field through one shield. A getter that throws would otherwise take the shop down
  // at the property access, before any check could run — and the shield also makes a type-guard in
  // front of it dead code, since a number or a string simply yields undefined.
  const get = (k) => field(spec, k);
  const id = text(get('id'));
  const price = num(get('price'), 0);
  const rawTier = text(get('tier'));
  return Object.freeze({
    id: id || null,
    name: text(get('name')) || id || 'unnamed',
    does: text(get('does')),
    wing: text(get('wing')) || null,
    url: text(get('url')) || null,
    // Unknown tier names are NOT quietly the bottom rung — they are unknown, which is a different
    // and more alarming thing than "not proven yet".
    tier: LADDER.includes(rawTier) ? rawTier : null,
    evidence: text(get('evidence')) || null,
    reach: list(get('reach')).filter(r => REACHES.includes(r)),
    mind: [0, 1, 2].includes(get('mind')) ? get('mind') : 0,
    price: Math.max(0, price),
    needs: list(get('needs')),
    // How the estate itself grades it. Carried, never invented here.
    rarity: RARITY.includes(text(get('rarity'))) ? text(get('rarity')) : 'normal',
  });
}

/**
 * May this be listed in the store at all, and at this price? Returns the refusal in words a seller
 * could argue with, because a store that silently drops a listing teaches nobody anything.
 */
function listable(a) {
  if (!a || !a.id) return { ok: false, why: 'it has no id, so nothing could install it' };
  if (!a.does) return { ok: false, why: 'it does not say what it does' };
  if (a.tier === null) return { ok: false, why: 'nothing has been computed about whether it works — an unranked thing cannot be listed' };
  if (!a.evidence) return { ok: false, why: 'its rank has nothing behind it: no run, no sha, nothing anybody could re-check' };
  if (a.price > 0 && a.tier !== TIER.proven) {
    return { ok: false, why: `it is priced but only ${a.tier}. Nothing gets charged for until its own gate breaks it on purpose and the tests catch it.` };
  }
  return { ok: true, why: a.price > 0 ? 'proven, with a run anybody can re-run' : `listed as ${a.tier}` };
}

/** The store: only what may honestly be sold, plus the refusals, said out loud. */
function store(specs) {
  const all = (Array.isArray(specs) ? specs : []).map(addon);
  const listed = [], refused = [];
  for (const a of all) {
    const v = listable(a);
    (v.ok ? listed : refused).push({ ...a, why: v.why });
  }
  listed.sort((x, y) => tierRank(y.tier) - tierRank(x.tier) || x.price - y.price || String(x.name).localeCompare(String(y.name)));
  return {
    listed, refused,
    counts: Object.fromEntries(LADDER.map(t => [t, listed.filter(a => a.tier === t).length])),
    paid: listed.filter(a => a.price > 0).length,
    free: listed.filter(a => a.price === 0).length,
    // A storefront that hides what it turned away is a storefront you cannot audit.
    verdict: !all.length ? 'Nothing in the catalogue yet.'
      : `${listed.length} listed, ${refused.length} refused for want of evidence.`,
  };
}

/**
 * What one addon can and cannot do — the lit ring and its shadow, before you install it.
 * No app store on earth tells you the second half.
 */
function inspect(a) {
  const can = a.reach.map(r => ({ reach: r, means: REACH[r] }));
  const cannot = REACHES.filter(r => !a.reach.includes(r)).map(r => ({ reach: r, means: REACH[r] }));
  return {
    can, cannot,
    // An addon that asks for nothing is not suspicious — it is the good case, and saying so plainly
    // is how a person learns to notice the one that asks for everything.
    say: can.length === 0 ? 'It asks for nothing at all: it cannot read, change, send or spend anything.'
      : `It can ${can.map(c => c.means).join(', ')}. It cannot ${cannot.map(c => c.means).join(', ')}.`,
  };
}

/** Refuse the install rather than trusting the addon to behave. */
function install(a, installedIds, catalogue) {
  const have = new Set(Array.isArray(installedIds) ? installedIds.map(text) : []);
  const by = new Map((Array.isArray(catalogue) ? catalogue : []).map(addon).map(x => [x.id, x]));
  if (!a || !a.id) return { ok: false, why: 'there is nothing here to install' };
  if (have.has(a.id)) return { ok: false, why: `${a.name} is already installed` };
  const v = listable(a);
  if (!v.ok) return { ok: false, why: `it cannot be installed: ${v.why}` };
  const missing = a.needs.filter(n => !have.has(n));
  if (missing.length) {
    // Installing it anyway would put a dead thing in your bags that looks exactly like a live one.
    return { ok: false, why: `it needs ${missing.map(m => (by.get(m) || { name: m }).name).join(', ')}, which you do not have`, missing };
  }
  return { ok: true, why: `${a.name} installed`, gained: a.reach };
}

/**
 * ⚑ THE PILE. What everything you have installed can do BETWEEN them — including the reaches that
 * exist only because of the combination, which no single install screen ever showed you.
 */
function held(installed) {
  const all = (Array.isArray(installed) ? installed : []).map(addon).filter(a => a.id);
  const reach = new Map();
  for (const a of all) for (const r of a.reach) {
    if (!reach.has(r)) reach.set(r, []);
    reach.get(r).push(a.name);
  }
  const combined = TOGETHER
    .filter(c => c.needs.every(n => reach.has(n)))
    .map(c => ({
      needs: c.needs,
      say: c.say,
      // Naming who brought each half is what makes it fixable: you can see which one to remove.
      by: c.needs.map(n => ({ reach: n, from: reach.get(n) })),
      // Only worth alarming about when no single addon already had the whole combination anyway.
      emergent: !all.some(a => c.needs.every(n => a.reach.includes(n))),
    }));
  const spent = all.reduce((t, a) => t + a.price, 0);
  const rented = all.filter(a => a.mind > 0);
  return {
    count: all.length,
    reach: [...reach.keys()].sort(),
    who: Object.fromEntries(reach),
    combined,
    // Said separately: an addon needing a model is not a fault, it is a running cost and a
    // dependency on somebody else's machine unless you built one.
    needsModel: rented.map(a => ({ name: a.name, mind: a.mind })),
    spent,
    verdict: !all.length ? 'Nothing installed. The client on its own reaches nothing.'
      : combined.filter(c => c.emergent).length
        ? `Together, what you have installed can do ${combined.filter(c => c.emergent).length} thing(s) no single one of them could.`
        : `${all.length} installed, and nothing they can do together that they could not do apart.`,
  };
}

/** Build the whole catalogue out of the estate's real index — never a typed list. */
function fromEstate(items, wings) {
  const rows = Array.isArray(items) ? items : [];
  const wingOf = new Map();
  for (const w of (Array.isArray(wings) ? wings : [])) {
    if (!w || typeof w !== 'object') continue;
    for (const r of (Array.isArray(w.rooms) ? w.rooms : [])) {
      const u = (() => { try { return text(r.u); } catch { return ''; } })();
      if (u) wingOf.set(u, text(w.id) || null);
    }
  }
  return rows.filter(r => r && typeof r === 'object' && !r.private).map(r => {
    const proof = (() => { try { return (r.proof && typeof r.proof === 'object') ? r.proof : {}; } catch { return {}; } })();
    return addon({
      id: text(r.name),
      name: text(r.title) || text(r.name),
      does: text(r.desc),
      url: text(r.url) || null,
      wing: wingOf.get(text(r.url)) || null,
      tier: text(proof.tier),
      // The evidence IS the workflow that ran. No run, no evidence, no listing.
      evidence: proof.workflow ? `${proof.workflow}${proof.sha ? ' @ ' + String(proof.sha).slice(0, 7) : ''}` : null,
      reach: list(r.reach),
      mind: r.mind,
      price: r.price,
    });
  });
}

return { TIER, RARITY, tierRank, TIER_MEANS, REACH, addon, listable, store, inspect, install, held, fromEstate };
})();

// ── talking to a paid model ──
const { PROVIDERS, providerOf, looksRight, buildCall, readReply, goingTo, explainStatus } = (() => {
// ══════════════════════════════════════════════════════════════════════════════════════════════
// providers.mjs — talking to a model you pay for, with your own key.
//
// The key lives in your browser and is sent to exactly one place: the host that issued it. It never
// reaches this site, because this site has no server to reach.
//
// ⚑ A KEY GOES TO ITS OWN PROVIDER OR IT GOES NOWHERE. This is the whole of the security here and it
// is enforced rather than promised: the host is baked into the provider, the caller cannot pass one
// in, and `callFor` refuses any provider it does not recognise. A bug that let an Anthropic key be
// posted to some other origin would be the single worst thing this client could do, so the URL is
// never assembled from anything a caller controls.
//
// ⚑ AND IT NEVER QUIETLY SWAPS PROVIDER. If the one you asked for fails, that is the answer. Falling
// back to a different model — or a different company — because the first one erred is how somebody
// ends up billed by a service they never signed up to, on a request they never saw.
//
// The pure parts are here: building a call, and reading a reply. The fetch itself is the caller's,
// which keeps everything worth gating gateable.
// ══════════════════════════════════════════════════════════════════════════════════════════════

/** Every provider this client knows, with the ONE host each key may ever be sent to. */
const PROVIDERS = Object.freeze({
  anthropic: Object.freeze({
    id: 'anthropic', name: 'Claude', host: 'api.anthropic.com',
    model: 'claude-sonnet-4-5-20250929',
    keyLooksLike: /^sk-ant-/,
    where: 'console.anthropic.com',
  }),
  google: Object.freeze({
    id: 'google', name: 'Gemini', host: 'generativelanguage.googleapis.com',
    model: 'gemini-2.0-flash',
    keyLooksLike: /^AIza/,
    where: 'aistudio.google.com',
  }),
});

const providerOf = (id) => PROVIDERS[String(id)] || null;


/**
 * Does this look like a key for this provider? A warning, never a gate — providers change their
 * formats and refusing a valid key because it did not match a pattern is worse than a soft note.
 */
function looksRight(providerId, key) {
  const p = providerOf(providerId);
  const k = text(key).trim();
  if (!p) return { ok: false, why: 'that is not a provider this client knows' };
  if (k.length < 9) return { ok: false, why: 'that is too short to be a key' };
  if (!p.keyLooksLike.test(k)) {
    return { ok: true, warn: `${p.name} keys usually start differently — check you have not pasted the wrong one` };
  }
  return { ok: true };
}

/**
 * Build the call. Returns everything the caller needs to fetch, and nothing it could get wrong:
 * the URL is assembled here from the provider's own baked-in host.
 */
function buildCall(providerId, key, { system = '', user = '', maxTokens = 700 } = {}) {
  const p = providerOf(providerId);
  if (!p) throw new Error(`no such provider: ${text(providerId)}`);
  const k = text(key).trim();
  if (!k) throw new Error(`no ${p.name} key`);
  const sys = text(system);
  const msg = text(user);

  if (p.id === 'anthropic') {
    return {
      url: `https://${p.host}/v1/messages`,
      init: {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': k,
          'anthropic-version': '2023-06-01',
          // Required for a browser to call the API directly. Without it the request is refused by
          // CORS and the failure looks like a network fault rather than a missing header.
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: p.model, max_tokens: maxTokens,
          ...(sys ? { system: sys } : {}),
          messages: [{ role: 'user', content: msg }],
        }),
      },
    };
  }

  // Google takes the key in the query string, which is their design, not a choice made here.
  return {
    url: `https://${p.host}/v1beta/models/${p.model}:generateContent?key=${encodeURIComponent(k)}`,
    init: {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        ...(sys ? { systemInstruction: { parts: [{ text: sys }] } } : {}),
        contents: [{ role: 'user', parts: [{ text: msg }] }],
        generationConfig: { maxOutputTokens: maxTokens },
      }),
    },
  };
}

/** Read a reply. Returns the text, or says plainly that there was none — never an empty success. */
function readReply(providerId, body) {
  const p = providerOf(providerId);
  if (!p) return { ok: false, why: 'no such provider' };
  const b = (body && typeof body === 'object') ? body : {};

  // An error body is an error even when the transport said 200. Reading past it and returning ''
  // would show the visitor a blank answer and no reason for it.
  const err = b.error;
  if (err) {
    // A bare code is not a reason. "401" alone in a chat box tells a person nothing they can act
    // on, so whatever the provider gave us is wrapped in a sentence rather than shown raw.
    const said = text(err && (err.message || err.status || err.code));
    return { ok: false, why: said ? `${p.name} returned an error: ${said}` : `${p.name} returned an error with nothing in it` };
  }

  let out = '';
  if (p.id === 'anthropic') {
    const parts = Array.isArray(b.content) ? b.content : [];
    out = parts.filter(x => x && x.type === 'text').map(x => text(x.text)).join('').trim();
  } else {
    const cand = (Array.isArray(b.candidates) ? b.candidates : [])[0] || {};
    const parts = (cand.content && Array.isArray(cand.content.parts)) ? cand.content.parts : [];
    out = parts.map(x => text(x && x.text)).join('').trim();
    // A reply cut off by a safety filter or a token cap is not a reply; saying so beats a fragment.
    if (!out && cand.finishReason) return { ok: false, why: `the model stopped: ${text(cand.finishReason)}` };
  }

  if (!out) return { ok: false, why: 'the provider answered, but with no text in it' };
  return { ok: true, text: out };
}

/**
 * ⚑ THE CHECK THAT MATTERS. Given a built call, confirm it is going to the provider's own host and
 * nowhere else. Cheap to run right before the fetch, and it is the difference between a key that
 * stays where it belongs and one that does not.
 */
function goingTo(providerId, url) {
  const p = providerOf(providerId);
  if (!p) return { ok: false, why: 'no such provider' };
  let host = null;
  try { host = new URL(text(url)).host; } catch { return { ok: false, why: 'that is not a URL' }; }
  if (host !== p.host) {
    return { ok: false, why: `refusing to send a ${p.name} key to ${host} — it may only go to ${p.host}` };
  }
  return { ok: true, host };
}

/** What a caller should do with a failed HTTP status, in words a person can act on. */
function explainStatus(providerId, status) {
  const p = providerOf(providerId);
  const name = p ? p.name : 'the provider';
  const s = Number(status);
  if (s === 401 || s === 403) return `${name} did not accept that key. Check it, or make a new one at ${p ? p.where : 'the provider'}.`;
  if (s === 429) return `${name} is rate-limiting you. Wait a moment and try again — nothing was charged for a refused call.`;
  if (s === 400) return `${name} refused the request as malformed. That is this client's fault, not yours.`;
  if (s >= 500) return `${name} is having trouble at their end. Nothing was sent anywhere else.`;
  return `${name} answered ${s}.`;
}

return { PROVIDERS, providerOf, looksRight, buildCall, readReply, goingTo, explainStatus };
})();

// ── the wall round an addon ──
const { ASKS, NEVER, judge, watch, ask, report, wantsMore } = (() => {
// ══════════════════════════════════════════════════════════════════════════════════════════════
// runtime.mjs — the part that makes a grant a wall instead of a label.
//
// Until now an addon's permissions were a list on a card. A list is a promise, and a promise made
// by the thing you are trying to contain is worth nothing. This is the judge that actually sits
// between an addon and everything it might want to touch.
//
// HOW IT IS BOXED, in the page: the addon runs inside a sandboxed frame whose content policy allows
// it no network of its own at all — it cannot fetch, cannot load an image, cannot open a socket. It
// has no DOM here, no storage, no keys. The ONLY thing it can do is ask the host, by message, and
// every ask comes through this file first.
//
// ⚑ AN ASK OUTSIDE THE GRANT IS REFUSED, NOT LOGGED AND ALLOWED. The common shape — warn and
// continue — is not containment, it is a diary of things that already happened.
//
// ⚑ AND EVERY REFUSAL IS KEPT. Every permission system shows you what an addon was ALLOWED. None of
// them shows you what it TRIED. An addon that asks, once, for something outside its grant might be
// a bug; one that asks forty times is telling you exactly what it was built to do, and that is the
// single most useful signal available about a thing you did not write.
//
// ⚑ THE GRANT IS THE ONE FROM INSTALL TIME. An addon cannot widen its own grant by asking, and it
// cannot widen it by updating itself either — a new reach is a new decision, made by the person, at
// the moment they can see it next to everything else already installed.
//
// Pure and total: no clock, no I/O, no randomness.
// ══════════════════════════════════════════════════════════════════════════════════════════════

/** What an addon can ask the host to do. One name per real capability, and no others exist. */
const ASKS = Object.freeze({
  read: 'read your notes and memory',
  write: 'change files on your machine',
  net: 'reach the internet',
  spend: 'spend from your budget',
  publish: 'put things where other people can see them',
  run: 'run other programs',
});
const NAMES = Object.keys(ASKS);

/** Asks that are always refused, whatever the grant says, because no addon has any business here. */
const NEVER = Object.freeze({
  keys: 'read your API keys',
  grant: 'change its own permissions',
  install: 'install another addon',
});
const NEVER_NAMES = Object.keys(NEVER);


/**
 * Judge one ask against the grant given at install time. Returns a decision, never a suggestion —
 * the caller is expected to act on `allow` and nothing else.
 */
function judge(ask, grant) {
  const what = text(ask && typeof ask === 'object' ? ask.what : ask);
  const held = new Set(Array.isArray(grant) ? grant.map(text) : []);

  // ⚑ Checked FIRST, so a grant that somehow contains one of these still cannot buy it. A rule that
  // can be unlocked by widening a list is not a rule.
  if (NEVER_NAMES.includes(what)) {
    return { allow: false, what, why: `no addon may ${NEVER[what]}, whatever its grant says`, never: true };
  }
  if (!NAMES.includes(what)) {
    return { allow: false, what, why: `"${what || 'nothing'}" is not something an addon can ask for`, unknown: true };
  }
  if (!held.has(what)) {
    return { allow: false, what, why: `it did not ask for permission to ${ASKS[what]} when you installed it` };
  }
  return { allow: true, what, why: `you allowed it to ${ASKS[what]}` };
}

/** A fresh record of what one addon has actually tried. */
function watch(id, grant) {
  return {
    id: text(id),
    grant: Object.freeze((Array.isArray(grant) ? grant : []).map(text).filter(g => NAMES.includes(g))),
    asks: [],
  };
}

/**
 * Put one ask through the judge and remember it. Returns the decision; the caller acts on it.
 * `at` is a caller-supplied ordinal, because this file has no clock.
 */
function ask(w, request, at) {
  const rec = (w && typeof w === 'object' && Array.isArray(w.asks)) ? w : watch('unknown', []);
  const d = judge(request, rec.grant);
  rec.asks.push({
    what: d.what,
    allowed: d.allow,
    why: d.why,
    at: Number.isFinite(at) ? at : rec.asks.length,
    // Kept so a refusal can be shown with what it was actually after, not just its category.
    // Read through a shield rather than a type-check: a request whose `detail` getter throws must
    // not take the wall down, and the shield makes the check in front of it dead code anyway.
    detail: (() => { try { return text(request.detail); } catch { return ''; } })(),
  });
  return d;
}

/**
 * What this addon has been doing. The refused list is the point: it is the only place you can see
 * what a thing you did not write was built to want.
 */
function report(w) {
  const rec = (w && typeof w === 'object' && Array.isArray(w.asks)) ? w : watch('unknown', []);
  const refused = rec.asks.filter(a => !a.allowed);
  const byWhat = {};
  for (const a of refused) byWhat[a.what] = (byWhat[a.what] || 0) + 1;
  const worst = Object.entries(byWhat).sort((a, b) => b[1] - a[1])[0] || null;

  // Reaching for something it was never granted, over and over, is not an accident.
  const persistent = Object.entries(byWhat).filter(([, n]) => n >= 3).map(([w2]) => w2);
  const forbidden = refused.filter(a => NEVER_NAMES.includes(a.what)).map(a => a.what);

  return {
    id: rec.id,
    grant: rec.grant,
    tried: rec.asks.length,
    allowed: rec.asks.length - refused.length,
    refused: refused.length,
    byWhat,
    persistent,
    forbidden: [...new Set(forbidden)],
    // ⚑ Nothing tried is not a clean bill of health — it is an addon you have not run yet.
    verdict: !rec.asks.length ? 'This has not asked for anything yet, which is not the same as it being harmless.'
      : forbidden.length ? `It tried to ${forbidden.map(f => NEVER[f]).join(' and ')}. Nothing is ever allowed to do that. Remove it.`
      : persistent.length ? `It has repeatedly tried to ${persistent.map(p => ASKS[p]).join(' and ')} without permission — ${worst[1]} times. That is what it was built to do.`
      : refused.length ? `${refused.length} ask(s) refused, the rest allowed.`
      : `${rec.asks.length} ask(s), all inside what you allowed.`,

}

/**
 * ⚑ AN ADDON MAY NOT WIDEN ITS OWN GRANT. Given what it holds and what it now wants, this returns
 * the difference for a PERSON to decide — it never returns a new grant. Updating itself is not
 * consent, and the moment an addon can talk its way into more reach, the install screen was theatre.
 */
function wantsMore(w, wanted) {

  const held = new Set(rec.grant || []);
  const want = (Array.isArray(wanted) ? wanted : []).map(text);
  const extra = want.filter(x => NAMES.includes(x) && !held.has(x));
  const impossible = want.filter(x => NEVER_NAMES.includes(x));
  return {
    extra,
    impossible,
    // Said in the person's words, at the moment they can see it beside everything else installed.
    say: impossible.length
      ? `It is asking to ${impossible.map(i => NEVER[i]).join(' and ')}, which nothing is ever allowed to do.`
      : extra.length === 0 ? 'It is asking for nothing new.'
        : `It now wants to ${extra.map(e => ASKS[e]).join(' and ')}, which you did not allow when you installed it.`,
    // Never granted here. This function's whole job is to hand the decision back.
    granted: false,
  };
