return { ASKS, NEVER, judge, watch, ask, report, wantsMore };
})();

// ── what an addon has to be ──
const { MIN_DOES, checkShape, agrees, admit, plumbing, afterAddon, frameFor } = (() => {
// ══════════════════════════════════════════════════════════════════════════════════════════════
// module.mjs — what an addon has to BE before it is allowed to run.
//
// An addon is one file. Inside the box it gets three things and nothing else:
//
//     manifest({ id, name, does, needs })   ·  said once, before it can do anything
//     run(async (host) => { … })            ·  the work, handed a host that honours the grant
//     host.read() / host.write(x) / …       ·  one method per capability, and no others exist
//
// ⚑ IT DECLARES BEFORE IT CAN DO ANYTHING. The box loads in two phases. In the first the addon has
// no host at all — it can only call `manifest`. The host then compares what the code says about
// itself against what the shop showed you, and only if those agree does the second phase begin.
// Nothing it might want has been reachable up to that point, so a mismatch is caught before the
// addon has had a single opportunity to act on it.
//
// ⚑ AND THE CODE MUST MATCH THE LISTING. This is the check no app store performs. The description
// you read and the thing you installed are two separate artefacts everywhere else — the listing is
// marketing, the binary is whatever it is, and nobody compares them. Here a file that asks for more
// than its listing declared is refused and the difference is named, because "it wanted more than it
// told you" is the single most useful thing anybody can know about a program.
//
// Declaring LESS than the listing is fine and is said out loud: a thing that turned out to need
// less than it advertised is good news, and quietly ignoring it would waste the only moment anybody
// would notice.
//
// Pure and total: no clock, no I/O, no randomness.
// ══════════════════════════════════════════════════════════════════════════════════════════════

const NAMES = Object.keys(ASKS);
const NEVER_NAMES = Object.keys(NEVER);


/** How long a description has to be before it counts as one. A shrug is not a description. */
const MIN_DOES = 20;

/**
 * Is this a manifest at all? Checked before anything is compared, because "it asked for too much"
 * is a confusing thing to be told about a file that never said what it was.
 */
function checkShape(declared) {
  const d = (declared && typeof declared === 'object' && !Array.isArray(declared)) ? declared : null;
  if (!d) return { ok: false, why: 'it never said what it is — an addon has to call manifest() before anything else' };

  const id = text(d.id).trim();
  if (!id) return { ok: false, why: 'its manifest has no id' };
  if (!text(d.name).trim()) return { ok: false, why: `${id} has no name` };

  const does = text(d.does).trim();
  if (does.length < MIN_DOES) {
    return { ok: false, why: `${id} describes itself in ${does.length} characters — that is a label, not a description of what it does` };
  }

  const needs = list(d.needs).map(n => n.trim()).filter(Boolean);
  const forbidden = needs.filter(n => NEVER_NAMES.includes(n));
  if (forbidden.length) {
    return { ok: false, why: `${id} asks to ${forbidden.map(n => NEVER[n]).join(' and ')}, which nothing is ever allowed to do` };
  }
  const invented = needs.filter(n => !NAMES.includes(n));
  if (invented.length) {
    return { ok: false, why: `${id} asks for ${invented.map(n => `"${n}"`).join(', ')}, which is not a thing an addon can ask for` };
  }

  return { ok: true, manifest: Object.freeze({ id, name: text(d.name).trim(), does, needs: Object.freeze([...new Set(needs)].sort()) }) };
}

/**
 * Does the code agree with the listing you were shown? Returns a verdict, and — when it does not —
 * the exact difference, in words, so a person can see what they were about to run.
 */
function agrees(manifest, listing) {
  const m = (manifest && typeof manifest === 'object') ? manifest : {};
  const l = (listing && typeof listing === 'object') ? listing : {};
  const mid = text(m.id).trim(), lid = text(l.id).trim();

  if (!mid || !lid) return { ok: false, why: 'one of these has no id, so there is nothing to compare' };
  if (mid !== lid) {
    // A file claiming to be something else is the oldest trick there is.
    return { ok: false, why: `you asked to install "${lid}" and this file calls itself "${mid}"`, swapped: true };
  }

  const wants = new Set(list(m.needs));
  const shown = new Set(list(l.reach));
  const more = [...wants].filter(w => !shown.has(w));
  const fewer = [...shown].filter(sn => !wants.has(sn));

  if (more.length) {
    return {
      ok: false,
      more,
      why: `the shop said ${lid} would ${shown.size ? [...shown].map(sn => ASKS[sn] || sn).join(' and ') : 'do none of these things'}, `
        + `but the file also wants to ${more.map(mn => ASKS[mn] || mn).join(' and ')}`,
    };
  }

  return {
    ok: true,
    fewer,
    // Good news is still news. Saying it is the only moment anybody would notice.
    why: fewer.length
      ? `it needs less than the shop said — it never asks to ${fewer.map(fn => ASKS[fn] || fn).join(' or ')}`
      : 'the file asks for exactly what the shop showed you',
  };
}

/** Everything that has to be true before the second phase begins, in one call. */
function admit(declared, listing) {
  const shape = checkShape(declared);
  if (!shape.ok) return { ok: false, why: shape.why, stage: 'shape' };
  const same = agrees(shape.manifest, listing);
  if (!same.ok) return { ok: false, why: same.why, stage: 'mismatch', more: same.more, swapped: same.swapped };
  return {
    ok: true,
    manifest: shape.manifest,
    // ⚑ THE GRANT IS THE INTERSECTION, never the union. If the two ever disagreed in a way we let
    // through, the smaller of them wins — an addon can only ever end up with less than it was
    // shown asking for, never more.
    grant: Object.freeze(shape.manifest.needs.filter(n => list(listing && listing.reach).includes(n))),
    why: same.why,
    fewer: same.fewer,
  };
}

/**
 * The document the addon runs inside. Built here so the wall is written down in one place and can
 * be read next to the rules it enforces.
 *
 * ⚑ `default-src 'none'` is the wall: no fetch, no image, no font, no socket, nothing. Paired with
 * a sandbox that withholds same-origin, the addon has no way to reach this page, its storage, or
 * anything on the network. The only exit is a message, and every message meets the judge first.
 */
/**
 * ⚑ THE BOX'S OWN CODE IS A REAL FUNCTION, NOT A STRING. It used to live inside a template literal,
 * which meant a mutation gate could break its every branch and no test would notice — the tests
 * could only check the SHAPE of the text, never what it did. Anything that has to ship as a string
 * should be written as a function and serialised, so it can be run and attacked like everything else.
 *
 * `plumbing` is phase one: it installs the two things an addon may call and nothing else. There is
 * deliberately no host here — see `afterAddon`.
 */
function plumbing() {
  const send = (m) => parent.postMessage(m, '*');
  self.__box = { declared: null, work: null, send };
  self.manifest = (m) => { self.__box.declared = m; };
  self.run = (fn) => { self.__box.work = fn; };
  addEventListener('error', (e) => send({ kind: 'broke', text: String(e && e.message) }));
  addEventListener('unhandledrejection', (e) => {
    const r = e && e.reason;
    send({ kind: 'broke', text: String((r && r.message) || r) });
  });
}

/**
 * Phase two: say what was declared, then wait. The host object is built INSIDE the go handler and
 * nowhere earlier — made at the top it would be a const in the same closure the addon's own code
 * runs in, reachable before anybody had compared the file against its listing. Phase one has to be
 * genuinely powerless, not merely unused.
 */
function afterAddon() {
  const box = self.__box;
  const send = box.send;
  send({ kind: 'declared', manifest: box.declared });

  const call = (what, detail) => new Promise((done) => {
    const id = String(Math.random()).slice(2) + String(Date.now());
    addEventListener('message', function onr(e) {
      if (!e.data) return;
      if (e.data.id !== id) return;
      removeEventListener('message', onr);
      done(e.data);
    });
    send({ kind: 'ask', id, what, detail: detail === undefined ? '' : String(detail) });
  });

  const may = (what) => async (d) => {
    const r = await call(what, d);
    // ⚑ A refused ask THROWS. Returning nothing lets an addon carry on as though it had been
    // allowed, and everything it does next is built on a permission it never got.
    if (!r.allowed) throw new Error(r.why);
    return r.data;
  };

  addEventListener('message', async (e) => {
    if (!e.data) return;
    if (e.data.kind !== 'go') return;
    if (typeof box.work !== 'function') { send({ kind: 'broke', text: 'it never called run()' }); return; }
    const host = {
      say: (t) => send({ kind: 'say', text: String(t) }),
      read: may('read'), write: may('write'), net: may('net'),
      spend: may('spend'), publish: may('publish'), run: may('run'),
    };
    try { await box.work(host); send({ kind: 'finished' }); }
    catch (err) { send({ kind: 'broke', text: String((err && err.message) || err) }); }
  });
}

/**
 * The document the addon runs inside. Three scripts in order: the plumbing, the addon's own source,
 * then the declaration and the wait. Splitting them is what lets the addon's code run at the top
 * level — where it can see `manifest` and `run` — without ever sharing a closure with the host.
 *
 * ⚑ `default-src 'none'` is the wall: no fetch, no image, no font, no socket, nothing. Note there is
 * no `unsafe-eval` either, which is why the addon's source is inlined rather than passed in as a
 * string to be evaluated — widening the policy to make the plumbing tidier would weaken the only
 * thing here that actually contains anybody.
 */
function frameFor(source) {
  // A closing script tag in the source would end our element early and drop the rest into the
  // document as markup, outside the part the policy was wrapped around.
  const safe = text(source).split('</script').join('<\\/script');
  const tag = (body) => '<scr' + 'ipt>' + body + '</scr' + 'ipt>';
  return '<!doctype html>\n'
    + '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\'">\n'
    + tag('(' + plumbing.toString() + ')();') + '\n'
    + tag(safe) + '\n'
    + tag('(' + afterAddon.toString() + ')();') + '\n';
}

return { MIN_DOES, checkShape, agrees, admit, plumbing, afterAddon, frameFor };
})();

// ── the one who shows you round ──
const { BEATS, standing, where, isOpen, locked, speak } = (() => {
// ══════════════════════════════════════════════════════════════════════════════════════════════
// guide.mjs — the character who shows you round, and what is open yet.
//
// HOW THIS IS BUILT, AND WHY. Games do not teach with a manual. You are doing the real thing inside
// ten seconds, on a first move that cannot go wrong, and somebody talks over your shoulder while you
// do it. Half-Life put you on a train. Portal gave you one cube. Nothing is explained before you
// have felt it, one idea at a time, each unlocked by having done the last.
//
// So there is no tutorial here and no help page. There is a person, a question, and a box to type
// in. Everything else appears when you have done the thing that makes it make sense — because a
// screen full of panels you have no reason for yet is the same as a manual, only harder to read.
//
// ⚑ THE FIRST MOVE CANNOT FAIL. It runs with no key, no model, no account and no network. If the
// first thing somebody does needs setting up, most people never do a second thing.
//
// ⚑ THE GUIDE SAYS WHAT HAPPENED, NEVER "WELL DONE". It is the same rule the marker follows: praise
// is what you give somebody instead of information. "That ran on your machine and cost nothing" is
// worth reading. "Great job!" is worth nothing and teaches the reader to skim.
//
// ⚑ AND IT NEVER BLOCKS. Every beat can be walked past. A guide you cannot get rid of is a cage,
// and the person who already knows this stuff is exactly the person you least want to annoy.
//
// Pure and total: no clock, no I/O, no randomness. The state goes in, the next beat comes out.
// ══════════════════════════════════════════════════════════════════════════════════════════════

/**
 * The beats, in order. Each one: what has to be true to be here, what the guide says, what the
 * person can do next, and what the beat opens up.
 *
 * `opens` is cumulative — reaching a beat opens everything that beat and every earlier one opened.
 */
// ⚑ NOTHING IS EVER LOCKED. Gating panels was the wrong reading of "gradual like an MMORPG":
// WoW does not hide the world from a level one — everything is THERE, and quests walk you through
// it in order. This place is also a testimonial, and a testimonial with most of its rooms shut is
// somebody hiding their own work. So the guide narrates the order; it never bars a door.
const ALL = Object.freeze(['didy', 'world', 'keys', 'store', 'bags', 'sandbox', 'learn']);

const BEATS = Object.freeze([
  {
    id: 'arrive',
    reached: () => true,
    says: 'Tell me something you are actually trying to decide. Not a test — a real one. I will lay out the ways it could go.',
    aside: 'I am your didy, powered by fall\u00b7os. No account, no key, nothing to set up — this runs on your own machine.',
    next: 'type it in and press the button',
    opens: [...ALL],
  },
  {
    id: 'thought',
    reached: (s) => s.runs >= 1,
    says: 'That ran on your own machine. No AI, no key, nothing sent anywhere, nothing charged — and it still read your words back and told you which ones counted.',
    aside: 'Everything it scored traces to something you actually typed. If it found nothing, say more about what is at stake.',
    next: 'take one of them, or ignore the lot',
    opens: ['didy', 'world'],
  },
  {
    id: 'chose',
    reached: (s) => s.picked >= 1,
    says: 'That was yours. I lay them out and rank them; I never pick. The ones I set aside are kept on purpose — the road you nearly took is the one you want back when the first choice fails.',
    aside: null,
    next: 'now go and get your didy some tools',
    opens: ['didy', 'world', 'store'],
  },
  {
    id: 'bought',
    reached: (s) => s.installed >= 1,
    says: 'That is yours now. Everything in the shop is ranked by what it has actually been shown to do, never by what its maker claims — most are not good enough to list at all, and that is the shop working.',
    aside: 'Anything you own turns up beside your didy, ready to drag in.',
    next: 'drag it into one of your didy\u2019s slots',
    opens: ['didy', 'world', 'store', 'bags'],
  },
  {
    // ⚑ THE CORE LOOP, and it comes before anything technical. Buy a thing, drag it in, your didy
    // can do that thing. Everything after this is about making it cost less.
    id: 'fitted',
    reached: (s) => s.fitted >= 1,
    says: 'That is the whole shape of it. You buy a thing, you drag it in, and your didy can do that thing — an accountant, a solicitor, an adviser. Pull it back out and it cannot. The more you fit, the more it does on its own.',
    aside: 'That is how this beats one big rented model: yours is assembled out of specialists, and you own them.',
    next: 'try it with a real AI behind it',
    opens: ['didy', 'world', 'store', 'bags', 'keys'],
  },
  {
    id: 'keyed',
    reached: (s) => s.keys >= 1,
    says: 'With a key in, I can put those same options into the words of your actual situation. Watch the bar at the top when I do.',
    aside: 'The key stays in this browser and only ever goes to the company that issued it. This site has no server to send it to.',
    next: 'ask for it in your own terms',
    opens: ['didy', 'world', 'store', 'bags', 'keys'],
  },
  {
    id: 'rented',
    reached: (s) => s.rented >= 1,
    says: 'The bar moved. That one went out to somebody else\u2019s machine and cost you money — and it will say so every single time, because a cost you stop being shown is one you stop noticing.',
    aside: 'It only put things in better words. It could not change the ranking — that was settled before it was asked.',
    next: 'get that work back onto your own machine',
    opens: ['didy', 'world', 'store', 'bags', 'keys'],
  },
  {
    id: 'local',
    reached: (s) => s.localUp,
    says: 'Now the same jobs stay home. That is the point of the whole thing: your bill goes down as you get better, not up. Nothing else you pay for works that way round.',
    aside: null,
    next: 'you have the run of the place now',
    opens: ['didy', 'world', 'store', 'bags', 'keys', 'sandbox', 'learn'],
  },

/** Read the player's state into the shape the beats ask about. Total: anything at all goes in. */
function standing(state) {
  const get = (k) => field(state, k);
  const ran = Array.isArray(get('ran')) ? get('ran') : [];
  const keys = get('keys');
  return Object.freeze({
    runs: ran.length,
    rented: ran.filter(r => r && r.rung === 't2').length,
    keys: (keys && typeof keys === 'object')
      ? Object.keys(keys).filter(p => typeof keys[p] === 'string' && keys[p].trim().length >= 9).length : 0,
    localUp: get('localUp') === true,
    installed: Array.isArray(get('bags')) ? get('bags').length : 0,
    picked: num(get('picked')),
    fitted: Array.isArray(get('slots')) ? get('slots').filter(Boolean).length : 0,
    // Someone who has said they are done is done. See `where`.
    dismissed: get('guideOff') === true,
  });
}

/**
 * Where the person is now: the furthest beat they have actually reached. Not a counter — a reading
 * of what they have really done, so refreshing the page or clearing a panel never rewinds them.
 */
function where(state) {
  const s = standing(state);
  let at = BEATS[0];
  for (const b of BEATS) { if (b.reached(s)) at = b; }
  return {
    beat: at,
    standing: s,
    // ⚑ Every beat can be walked past. A guide you cannot dismiss is a cage, and the person who
    // already knows all this is exactly the one you least want to trap.
    showing: !s.dismissed,
    // Cumulative: reaching a beat opens everything the earlier ones opened too, so nothing that was
    // once available ever disappears again.
    open: Object.freeze([...new Set(BEATS.filter(b => b.reached(s)).flatMap(b => b.opens))]),
  };
}

/** Is this panel open yet? Unknown panels are closed — a typo must not unlock the whole app. */
function isOpen(state, panel) {
  return where(state).open.includes(String(panel));
}

/** What is still shut, and what would open it — so nothing is ever mysteriously missing. */
function locked(state) {
  const open = new Set(where(state).open);
  const shut = ALL.filter(p => !open.has(p));
  const opener = {};
  for (const p of shut) {
    const b = BEATS.find(x => x.opens.includes(p));
    if (b) opener[p] = b.next;
  }
  return { shut, opener };
}

/**
 * The whole line the guide shows, in one call. Returns null when there is nothing to say — silence
 * is a real option and a guide that always has an opinion becomes wallpaper.
 */
function speak(state) {
  const w = where(state);
  if (!w.showing) return null;
  return {
    id: w.beat.id,
    says: w.beat.says,
    aside: w.beat.aside,
    next: w.beat.next,
    // Where they are along the way, so it is finite and visibly finite.
    step: BEATS.indexOf(w.beat) + 1,
    of: BEATS.length,
    last: BEATS.indexOf(w.beat) === BEATS.length - 1,
  };
}

return { BEATS, standing, where, isOpen, locked, speak };
})();

/* ── the card gate · inlined verbatim-adapted from fallkard-forge card.mjs @ d380947 ──
   Cards are how tools travel: a picture that openly carries a real build, sealed with a hash.
   Reading one back means: parse the declared PNG chunks, take the payload and manifest out,
   RECOMPUTE the seal, and refuse anything that does not match. No trust, just arithmetic. */
const CARDGATE = (() => {
  const PNG_SIG = new Uint8Array([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);
  const PAYLOAD_KEYWORD = 'konomi-payload', MANIFEST_KEYWORD = 'konomi-manifest', NUL = '\u0000';
  const latin1 = (u8) => { let out = ''; for (const b of u8) out += String.fromCharCode(b); return out; };
  function parseChunks(png) {
    const u8 = (png instanceof Uint8Array) ? png : new Uint8Array(png || []);
    if (u8.length < 8) throw new Error('not a PNG (too short)');
    for (let i = 0; i < 8; i++) if (u8[i] !== PNG_SIG[i]) throw new Error('not a PNG (bad signature)');
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const chunks = [];
    let off = 8, sawEnd = false;
    while (off + 8 <= u8.length) {
      const length = dv.getUint32(off);
      if (off + 12 + length > u8.length) throw new Error('PNG is truncated \u2014 a chunk runs past the end of the file');
      const type = latin1(u8.subarray(off + 4, off + 8));
      chunks.push({ type, data: u8.subarray(off + 8, off + 8 + length) });
      off += 12 + length;
      if (type === 'IEND') { sawEnd = true; break; }
    }
    if (!sawEnd) throw new Error('PNG is truncated \u2014 it has no IEND');
    return chunks;
  }
  function readText(chunks, keyword) {
    for (const c of (Array.isArray(chunks) ? chunks : [])) {
      if (!c || c.type !== 'tEXt') continue;
      const t = latin1(c.data);
      const nul = t.indexOf(NUL);
      if (nul < 0) continue;
      if (t.slice(0, nul) === String(keyword)) return t.slice(nul + 1);
    }
    return null;
  }
  async function readZText(chunks, keyword) {
    for (const c of (Array.isArray(chunks) ? chunks : [])) {
      if (!c || c.type !== 'zTXt') continue;
      const t = latin1(c.data);
      const nul = t.indexOf(NUL);
      if (nul < 0 || t.slice(0, nul) !== String(keyword)) continue;
      const deflated = c.data.subarray(nul + 2); // NUL + 1-byte compression method
      const ds = new DecompressionStream('deflate');
      const out = new Response(new Blob([deflated]).stream().pipeThrough(ds));
      return latin1(new Uint8Array(await out.arrayBuffer()));
    }
    return null;
  }
  const sha256hex = async (u8) => Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', u8)))
    .map(b => b.toString(16).padStart(2, '0')).join('');
  async function readCard(u8) {
    const chunks = parseChunks(u8);
    let payloadB64 = readText(chunks, PAYLOAD_KEYWORD);
    if (payloadB64 == null) payloadB64 = await readZText(chunks, PAYLOAD_KEYWORD);
    const manifestRaw = readText(chunks, MANIFEST_KEYWORD);
    let manifest = null;
    if (manifestRaw != null) { try { manifest = JSON.parse(manifestRaw); } catch { /* said below */ } }
    if (manifest == null && payloadB64 == null) return { isCard: false, reason: 'a plain picture \u2014 there is no build inside it' };
    if (manifestRaw != null && manifest == null) return { isCard: false, reason: 'the manifest on this card is not readable' };
    if (payloadB64 == null) return { isCard: false, reason: 'it has a manifest but the build is missing' };
    if (manifest == null) return { isCard: false, reason: 'it has a build but nothing says what it is' };
    return { isCard: true, manifest, payloadB64 };
  }
  return { readCard, sha256hex };
})();

async function cardArrives(file) {
  try {
    const u8 = new Uint8Array(await file.arrayBuffer());
    let r;
    try { r = await CARDGATE.readCard(u8); } catch (e) { say('Not a card: ' + e.message); return; }
    if (!r.isCard) { say(r.reason + '. Nothing installed.'); return; }
    const gz = Uint8Array.from(atob(r.payloadB64), ch => ch.charCodeAt(0));
    const actual = await CARDGATE.sha256hex(gz);
    if (actual !== r.manifest.seal) {
      say('The seal does not match \u2014 this card was changed after it was forged. Refused: nothing installed.');
      return;
    }
    const id = 'card-' + actual.slice(0, 8);
    if (me.bags.includes(id)) { say('You already hold this card.'); return; }
    const tag = String(r.manifest.tags || '').split(',')[0].split(':')[0].trim();
    const entry = {
      id,
      name: tag ? tag + ' (card)' : 'forged card ' + actual.slice(0, 8),
      kind: 'card',
      does: 'a sealed build that arrived as a card \u2014 the seal was recomputed here when it landed. Hatch the build itself in the Forge.',
      tier: r.manifest.assessor_pass ? 'proven' : 'prototype',
      rarity: r.manifest.rarity || 'normal',
      reach: [], // un-hatched, it can read, change, send and spend nothing \u2014 the good case, said plainly
      evidence: 'seal sha256:' + actual.slice(0, 12) + '\u2026 \u2014 recomputed on arrival, not taken on trust',
      url: 'https://sjgant80-hub.github.io/fallkard-forge/',
    };
    me.cards = me.cards || [];
    me.cards.push(entry); byId.set(id, entry);
    me.bags.push(id); save();
    say('\u2713 Real and sealed \u2014 ' + entry.name + ' is yours now. Fit it like any tool, or hatch the build in the Forge.');
    draw();
  } catch (e) { say('Could not read that: ' + ((e && e.message) || e)); }
}

function cardGateUI() {

  t.innerHTML = '<b>Been given a card?</b> Tools travel as cards \u2014 a picture that openly carries the real build, sealed with a hash. '
    + 'Drop one here (or click to choose) and it is checked in front of you, then it is yours. '

  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/png'; inp.hidden = true;
  inp.addEventListener('change', () => { if (inp.files[0]) cardArrives(inp.files[0]); inp.value = ''; });
  w.append(t, inp);
  w.addEventListener('click', (ev) => { if (ev.target.tagName !== 'A') inp.click(); });
  w.addEventListener('dragover', (ev) => { ev.preventDefault(); w.classList.add('over'); });
  w.addEventListener('dragleave', () => w.classList.remove('over'));
  w.addEventListener('drop', (ev) => {
    ev.preventDefault(); w.classList.remove('over');
    if (ev.dataTransfer.files[0]) cardArrives(ev.dataTransfer.files[0]);
  });
  return w;
}

let shown = new Set();
function drawNav() {
  const n = $('#nav'); n.replaceChildren();
  const open = new Set(where(me).open);
  for (const p of PANELS) {
    if (!open.has(p.id)) continue;
    const b = el('button', p.id === at ? 'on' : '');
    b.type = 'button'; b.title = `${p.lb} (${p.key})`;
    b.append(el('span', 'ic', p.ic), el('span', 'lb', p.lb), el('span', 'k', p.key));
    b.addEventListener('click', () => { at = p.id; draw(); });
    n.append(b);
  }
  // The moment. Nothing arrives silently — you are told what you just got, once.
  const fresh = [...open].filter(x => !shown.has(x));
  if (shown.size && fresh.length) {
    const names = fresh.map(x => (PANELS.find(p => p.id === x) || {}).lb).filter(Boolean);
    if (names.length) unlockFlash(names);
  }
  shown = open;
}

// ── running an addon, boxed ───────────────────────────────────────────────────────────────────
//
// ⚑ THE BOX IS REAL, NOT A CONVENTION. The addon runs inside a sandboxed frame with its own content
// policy set to allow NOTHING from anywhere: it cannot fetch, cannot load an image, cannot open a
// socket. `sandbox="allow-scripts"` and no allow-same-origin means it has no access to this page,
// no storage, no keys, no DOM of ours. The only thing it can do is send a message, and every
// message goes through the wall before anything happens.
//
// ⚑ AND WHAT IT TRIED IS KEPT. An addon reaching for something outside its grant once may be a bug.
// Reaching forty times is the thing telling you what it was built for, and that record is the whole
// reason to run somebody else's code at all.
const RUNNING = new Map();

function boxFor(code) {
  // default-src 'none' is the wall. Nothing loads, nothing connects, nothing leaves.
  return `<!doctype html><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'">
<script>
const send = (m) => parent.postMessage(m, '*');
const ask = (what, detail) => new Promise((ok) => {
  const id = Math.random().toString(36).slice(2);
  addEventListener('message', function onr(e) {
    if (!e.data || e.data.id !== id) return;
    removeEventListener('message', onr); ok(e.data);
  });
  send({ kind: 'ask', id, what, detail });
});
const say = (t) => send({ kind: 'say', text: String(t) });
addEventListener('error', (e) => send({ kind: 'broke', text: String(e.message) }));
(async () => { try { ${code} } catch (e) { send({ kind: 'broke', text: String(e && e.message || e) }); } })();
<\/script>`;
}

function runAddon(a, code, onEvent) {
  const w = watch(a.id, a.reach);
  RUNNING.set(a.id, w);
  let n = 0;

  const frame = document.createElement('iframe');
  frame.sandbox = 'allow-scripts';          // no allow-same-origin: it cannot touch this page
  frame.style.display = 'none';
  frame.srcdoc = boxFor(code);

  const onMsg = (e) => {
    if (e.source !== frame.contentWindow || !e.data) return;
    const m = e.data;
    if (m.kind === 'say') return onEvent({ kind: 'say', text: String(m.text).slice(0, 400) });
    if (m.kind === 'broke') return onEvent({ kind: 'broke', text: String(m.text).slice(0, 200) });
    if (m.kind !== 'ask') return;

    const d = ask(w, { what: m.what, detail: m.detail }, n++);
    onEvent({ kind: 'ask', what: m.what, allowed: d.allow, why: d.why, detail: m.detail });

    // Only what the wall allowed is ever actually done, and even then only the host does it.
    let data = null;
    if (d.allow && m.what === 'read') data = { notes: me.last || '' };
    frame.contentWindow.postMessage({ id: m.id, allowed: d.allow, why: d.why, data }, '*');
  };

  addEventListener('message', onMsg);
  document.body.append(frame);
  return {
    watcher: w,
    stop() { removeEventListener('message', onMsg); frame.remove(); },
  };
}

// ── talking to a model you pay for ────────────────────────────────────────────────────────────
//
// ⚑ THE MODEL PHRASES; IT NEVER DECIDES. fall-os's t1 organ takes an injected generate function and
// returns PHRASINGS keyed to branches whose score, order and label were already fixed by t0. A model
// that tries to invent a stance, reorder the list or award itself the win cannot move anything,
// because nothing it says is ever read as a number. That property is fall-os's, already gated, and
// it is the reason a rented model can be let anywhere near this at all.
async function askModel(providerId, system, user) {
  const key = me.keys[providerId];
  if (!key) throw new Error(`no ${providerId} key`);
  const { url, init } = buildCall(providerId, key, { system, user });

  // Checked immediately before the fetch, every time. This is the one thing that must never be
  // wrong, so it is verified at the moment of sending rather than trusted from construction.
  const going = goingTo(providerId, url);
  if (!going.ok) throw new Error(going.why);

  let res;
  try { res = await fetch(url, init); }
  catch (e) {
    throw new Error(`could not reach ${providerOf(providerId).name} (${e.message}). Nothing was sent anywhere else.`);
  }
  let body = null;
  try { body = await res.json(); } catch { body = null; }
  if (!res.ok) throw new Error(explainStatus(providerId, res.status));
  const out = readReply(providerId, body);
  if (!out.ok) throw new Error(out.why);
  return out.text;
}


// ⚑ FITTING A TOOL IS REGISTERING AN ORGAN. Not a metaphor and not a picture of one: this calls the
// same function fall-os names `train` — you train a didy by registering its organs. Take one out and
// the didy genuinely cannot do that thing any more, because the conductor is rebuilt without it.
function fit(id, slot) {
  const a = byId.get(id);
  if (!a || !me.bags.includes(id)) { say('You do not own that one yet.'); return; }
  me.slots = me.slots || [null, null, null, null, null, null];
  if (me.slots.includes(id)) { say(a.name + ' is already fitted.'); return; }
  me.slots[slot] = id;
  save(); draw();
  say(a.name + ' fitted — your didy can do that now.');
}

// Built fresh every time, so a tool you pulled out is really gone. A didy that remembers an organ
// you removed is lying about what it can do.
function myDidy(asked) {
  const d = makeDidy('fallworld');
  register(d, 't0', t0Organ(asked));
  for (const id of (me.slots || []).filter(Boolean)) {
    const a = byId.get(id);
    if (a) register(d, a.id, { phase: 'explore', from: a.name, does: a.does });
  }
  return d;
}

// The right-hand side of the cockpit: what your didy is, what it is carrying, and what it has cost.
function drawRig() {
  const fitted = (me.slots || []).map(id => (id ? byId.get(id) : null));
  const on = fitted.filter(Boolean);
  const rig = el('div', 'rig' + (on.length ? ' powered' : ''));
  rig.append(el('div', 'who', 'your didy'));
  const ring = el('div', 'ring'); ring.textContent = '\u25c8'; rig.append(ring);

  const can = el('div', 'can');
  can.innerHTML = on.length
    ? 'it can also <b>' + on.map(a => esc(a.does.split(/[.\u00b7]/)[0].trim().toLowerCase()).slice(0, 46)).join('</b>, <b>') + '</b>'
    : 'right now it reads your words and lays out your options. Drag something in to give it more.';
  rig.append(can);

  const slots = el('div', 'slots');
  fitted.forEach((a, i) => {
    const d = el('div', 'slot' + (a ? ' filled' : ''));
    if (a) {
      d.append(el('div', 'fn', a.name));
      const pull = el('button', 'pull', 'take out'); pull.type = 'button';
      pull.addEventListener('click', () => {
        me.slots[i] = null; save(); draw();
        say(a.name + ' taken out. Your didy cannot do that any more.');
      });
      d.append(pull);
    } else d.textContent = on.length ? 'empty' : 'drag or tap a tool below to fit it here';
    d.addEventListener('dragover', (ev) => { ev.preventDefault(); d.classList.add('over'); });
    d.addEventListener('dragleave', () => d.classList.remove('over'));
    d.addEventListener('drop', (ev) => { ev.preventDefault(); d.classList.remove('over'); fit(ev.dataTransfer.getData('text/plain'), i); });
    slots.append(d);
  });
  rig.append(slots);

  // stats, read off what actually happened
  const t = tally(me.ran);
  const st = el('div', 'stats');
  const line = (k, v, cls) => { const r = el('div', 'stat'); r.append(el('span', null, k)); const b = el('b', cls || null, v); r.append(b); return r; };
  // ⚑ Six zeros is not a scoreboard, it is a broken-looking screen. Numbers arrive when there is
  // something to count; before that the panel says what it is for instead.
  if (!t.runs && !on.length) {
    st.append(el('div', 'quiet', 'Once you have run something, this is where what it cost you shows up.'));
    rig.append(st);
    return rigTail(rig, on);
  }
  st.append(line('jobs run', String(t.runs)));
  st.append(line('on your machine', String(t.yours), 'm'));
  st.append(line('rented', String(t.rented), t.rented ? 'r' : null));
  st.append(line('spent', String(t.spent), t.spent ? 'r' : null));
  st.append(line('tools fitted', on.length + '/6'));
  // ⚑ THE NUMBER THAT GOES UP. Power is what you have assembled: each tool your didy carries is one
  // more thing it can do without renting. It is the reason to keep adding, and it is honest — it
  // counts what is actually in the slots, not what you own and left in a drawer.
  st.append(line('power', String(on.length * 10 + t.yours), 'm'));
  rig.append(st);

  return rigTail(rig, on);
}

// What you own but have not fitted — the things you drag. Split out so the panel can return early
// when there is nothing worth counting yet and still offer the tools.
function rigTail(rig, on) {
  const spare = owned().filter(a => !(me.slots || []).includes(a.id));
  const tools = el('div', 'tools');
  if (!spare.length) {
    tools.append(el('div', 'quiet', owned().length ? 'Everything you own is fitted.' : 'Nothing to fit yet — the store fills this.'));
  }
  for (const a of spare) {
    const tl = el('div', 'tool ' + (a.tier || 'prototype') + ' n-' + (a.rarity || 'normal'));
    tl.draggable = true;
    tl.append(el('div', 'tn', a.name), el('div', 'grab', 'drag into a slot \u00b7 or just tap it'));
    tl.addEventListener('dragstart', (ev) => { ev.dataTransfer.setData('text/plain', a.id); tl.classList.add('dragging'); });
    tl.addEventListener('dragend', () => tl.classList.remove('dragging'));
    // No drag on a phone: a tap drops it into the first free slot instead.
    tl.addEventListener('click', () => {
      const free = (me.slots || []).findIndex(x => !x);
      if (free < 0) { say('Every slot is full — take one out first.'); return; }
      fit(a.id, free);
    });
    tools.append(tl);
  }
  rig.append(tools);
  return rig;
}

// ── running the real conductor ────────────────────────────────────────────────────────────────
async function probeLocal() {
  try {
    const r = await fetch('http://127.0.0.1:11434/api/tags', { signal: AbortSignal.timeout(2000) });
    return r.ok;
  } catch { return false; }
}

function runDidy(what, out, where) {
  const asked = String(what || '').trim();
  if (!asked) { say('Tell it what you are deciding first.'); return; }
  me.last = asked; save();

  // Where would this run? Asked before anything happens, and shown either way.
  const decision = route(asked, me, { mind: 0 });
  out.replaceChildren();

  // ⚑ The conductor itself needs no model at all: t0 is deterministic. So the page always works,
  // key or no key — and the rung only decides whether it can also be put into better words.
  const organ = t0Organ(asked);
  const didy = myDidy(asked);
  const run = conduct(didy, asked, { n: 6 });
  const carrying = Object.keys(didy.organs).filter(k => k !== 't0');
  const ev = organ.evidence;

  me.ran.push({ rung: 't0', mind: 0, cost: 0 });
  save();

  const note = el('div', 'note');
  note.textContent = summarise(run.field, ev)
    + (carrying.length ? ' Your didy used ' + carrying.length + ' of your own tools on this.' : '');
  out.append(note);

  if (!ev.found) {
    out.append(el('div', 'note', 'It found no signals it could name in that. Say more about what is at stake — what it costs, who it affects, what happens if it goes wrong — and the ranking will change.'));
  }

  out.append(el('h3', null, 'ways you could go'));
  const held_ = run.field.holds || [];
  const roads = run.field.roads || [];
  held_.forEach((h, i) => out.append(stanceCard(h, i === 0 ? 'top' : 'held', ev)));
  if (roads.length) {
    out.append(el('h3', null, 'set aside — and why that matters'));
    out.append(el('div', 'note', 'These did not clear the bar on your own words. They are kept, not deleted: the road you nearly took is the thing you want back when the first one fails.'));
    for (const r of roads) out.append(stanceCard(r, 'road', ev));
  }

  // The field is already complete and useful. A model, if you have one, only says it better — so it
  // is offered as a second step rather than blocking the first.
  const canPhrase = reach(me).t2;
  if (canPhrase && held_.length) {
    const rowP = el('div', 'row');
    const better = el('button', 'act', 'put this in my own terms'); better.type = 'button';
    const cost = el('span', 'quiet');
    const paid = route(asked, me, { mind: 2 });
    cost.textContent = paid.yours ? 'free — runs on your machine' : `this one costs money · ${paid.name}`;
    rowP.append(better, cost);
    out.append(rowP);
    better.addEventListener('click', async () => {
      better.disabled = true; better.textContent = 'asking…';

      // ⚑ phrase() takes ONE prompt and NEVER throws — it catches the failure and reports it in
      // `note`. So there is nothing to wrap: fall-os is already being honest about what happened,
      // and the job here is to repeat it rather than invent a friendlier version.
      const r = await phrase(asked, held_, ev, (prompt) => askModel(paid.provider, SYSTEM, prompt));

      // Only rows the model actually rewrote get a new line. Anything it echoed back keeps the
      // built-in wording, because an echo is the characteristic failure that most looks like success.
      const cards = [...out.querySelectorAll('.stance.top, .stance.held')];
      r.rows.forEach((row, i) => {
        if (!row.phrased || !cards[i]) return;
        const line = el('div', 'm');
        line.style.color = 'var(--ink)';
        line.textContent = row.phrased;
        cards[i].append(line);
      });

      if (r.failed) {
        better.disabled = false; better.textContent = 'try again';
        // Nothing was charged for a call that never landed, and nothing was sent anywhere else.
        say(r.note);
        return;
      }

      me.ran.push({ rung: paid.rung, mind: 2, cost: paid.cost }); save(); drawTop();
      better.textContent = 'done';
      say(`${r.note}. Nothing it wrote changed a single score — every one of those was fixed before it was asked.`);
    });
  }

  // ⚑ THE OFFER IS ONLY MADE WHERE IT HAS BEEN EARNED. Every line is attached to a thing this
  // person has actually just done — telling somebody they watched work come home when they never
  // ran anything locally is the same lie the rest of this refuses.
  const b = caption(me);
  if (b) {
    const box = el('div', 'bridge');
    box.append(el('div', 'l', b.says));
    const a = el('a'); a.href = b.href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = b.then;
    box.append(a);
    box.append(el('div', 't', b.terms));
    out.append(box);
  }

  drawTop(); drawNav(); drawNpc();
  where.innerHTML = decision.refused
    ? `<b class="r">${decision.refused}</b>`
    : decision.yours ? 'ran on <b>your machine</b> · free'
    : `ran on <b class="r">${decision.name}</b>`;
  say(`${held_.length} ways kept, ${roads.length} set aside — nothing is decided until you pick one.`);
}

function stanceCard(branch, kind, ev) {
  const v = branch.value || branch;
  const d = el('div', 'stance ' + kind);
  const h = el('div', 'h');
  h.append(el('span', 'n', v.label || v.stance || 'a way to go'));
  h.append(el('span', 'sc', typeof branch.score === 'number' ? branch.score.toFixed(2) : ''));
  d.append(h);
  if (v.move) d.append(el('div', 'm', v.move));

  // ⚑ SHOW THE WORDS, NOT THE CODE. The organ reports which SIGNALS moved a stance, by id — and an
  // id on the screen reads as "unknown", which is worse than saying nothing. The whole promise of
  // the tier-0 conductor is that every score traces back to a word you actually typed, so the words
  // are what goes on the card.
  const found = new Map(((ev && ev.signals) || []).map(sg => [sg.id, sg]));
  const said = (ids) => (ids || [])
    .map(id => found.get(id))
    .filter(Boolean)
    .map(sg => `${sg.label} (${sg.cues.join(', ')})`);
  const up = said(v.up), down = said(v.down);
  if (up.length) d.append(el('div', 'cue', 'counts for it: ' + up.join(' · ')));
  if (down.length) d.append(el('div', 'cue', 'counts against it: ' + down.join(' · ')));
  if (!up.length && !down.length) {
    d.append(el('div', 'cue', 'nothing in your words moved this either way — it is here on its default standing'));
  }

  if (kind !== 'road') {
    const b = el('button', 'pick', 'take this one'); b.type = 'button';
    b.addEventListener('click', () => {
      me.picked = (Number.isFinite(me.picked) ? me.picked : 0) + 1; save(); draw();
      say(`You took "${v.label || v.stance}". Nothing was decided for you — that was yours.`);
      d.classList.add('top');
      b.disabled = true; b.textContent = 'taken';
    });
    d.append(b);
  }
  return d;
}

function draw() {
  drawTop(); drawNav(); drawNpc();
  const p = $('#panel'); p.replaceChildren();
  if (!isOpen(me, at)) {
    // Never a dead end: it says exactly what would open it, and takes you back to doing that.
    const shutList = locked(me);
    const box = el('div', 'lockedNote');
    box.append(el('div', null, `Not open yet — ${shutList.opener[at] || 'keep going'}.`));
    const b = el('button', 'act', 'back to your didy'); b.type = 'button'; b.style.marginTop = '10px';
    b.addEventListener('click', () => { at = 'didy'; draw(); });
    box.append(b);
    p.append(box);
    return;
  }
  p.append((P[at] || P.didy)());
  document.querySelector('main').scrollTop = 0;
}

addEventListener('keydown', (e) => {
  if (e.target.matches('input,textarea')) return;
  const hit = PANELS.find(x => x.key.toLowerCase() === e.key.toLowerCase());
  if (hit) { at = hit.id; draw(); }
});

let prompt_ = null;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); prompt_ = e; });
// The download IS the point: your didy leaves the tab and lives on your machine. So the button is
// always visible — hiding it until Chrome volunteers a prompt meant most people never saw a way to
// keep it at all.
if (matchMedia('(display-mode: standalone)').matches) {
  $('#install').textContent = '\u2713 yours';
  $('#install').title = 'Already on your machine \u2014 this is the kept copy, and it works with no internet.';
} else {
  $('#install').textContent = '\u2b07 keep your didy';
  $('#install').title = 'Put it on your machine \u2014 it opens like an app and works with no internet.';
}
$('#install').addEventListener('click', async () => {
  if (matchMedia('(display-mode: standalone)').matches) {
    say('Already yours \u2014 this copy lives on your machine and works with no internet.');
    return;
  }
  if (prompt_) {
    prompt_.prompt(); const r = await prompt_.userChoice;
    say(r.outcome === 'accepted'
      ? 'Kept. Your didy now opens from your own machine and works with no internet \u2014 nothing to sign up for, nothing rented.'
      : 'No harm \u2014 it keeps working right here, and the button stays if you change your mind.');
    prompt_ = null;
    return;
  }
  // No native prompt in this browser - say exactly where ITS install lives.
  const ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/.test(ua)) {
    say('On iPhone or iPad: tap the Share button (the square with the arrow), then "Add to Home Screen". After that your didy opens like an app and works with no internet.');
  } else if (/Firefox/.test(ua)) {
    say('Firefox does not offer app installs on desktop \u2014 bookmark this page instead; it already works offline once visited. On Android Firefox: menu \u2192 "Install".');
  } else {
    say('In your browser\'s menu look for "Install app" or "Add to Home screen" \u2014 usually an icon at the right end of the address bar. After that your didy opens like an app and works with no internet.');
  }
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

draw();
say(`${SHOP.listed.length} things listed · ${SHOP.refused.length} refused for want of evidence · works with no key at all`);
</script>
</body>
